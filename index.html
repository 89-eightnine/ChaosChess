                    else { if (!p) openEnds++; break; }
                }
                if (count >= 5) score += 10000;
                else if (count === 4 && openEnds === 2) score += 5000;
                else if (count === 4 && openEnds === 1) score += 1200;
                else if (count === 3 && openEnds === 2) score += 600;
                else if (count === 3 && openEnds === 1) score += 200;
                else if (count === 2 && openEnds === 2) score += 80;
            }
            return score;
        }

        // ---- 国际跳棋 AI ----
        function aiCheckersMove(color) {
            // 连跳中途：从 midJumpPos 继续跳
            if (midJumpPos) {
                const contMoves = generateRawMoves(board, midJumpPos.row, midJumpPos.col).filter(m => m.isJump);
                if (contMoves.length === 0) return;
                const chosen = contMoves[Math.floor(Math.random() * contMoves.length)];
                validMoves = contMoves;
                executeCheckersJump(midJumpPos.row, midJumpPos.col, chosen.row, chosen.col);
                return;
            }

            const hasJump = checkersHasAnyJump(board, color);
            const allMoves = [];
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    const p = board[r][c];
                    if (p && p.color === color) {
                        let raw = generateRawMoves(board, r, c);
                        if (hasJump) raw = raw.filter(m => m.isJump);
                        for (const m of raw) {
                            allMoves.push({ fromR: r, fromC: c, toR: m.row, toC: m.col, isJump: !!m.isJump });
                        }
                    }
                }
            }
            if (allMoves.length === 0) return;

            let bestScore = -Infinity;
            let bestMoves = [];
            const forward = color === 'red' ? -1 : 1;
            const promoteRow = color === 'red' ? 0 : 9;

            for (const mv of allMoves) {
                let score = 0;
                const piece = board[mv.fromR][mv.fromC];

                if (mv.isJump) score += 600;          // 跳吃优先
                if (piece.type === 'checker-man') {
                    // 前进得分
                    if (forward * (mv.toR - mv.fromR) < 0) score += 35;
                    // 靠近升变线
                    score += (9 - Math.abs(mv.toR - promoteRow)) * 6;
                }
                // 安全检查：落点不会被反吃
                let safe = true;
                const enemy = color === 'red' ? 'blue' : 'red';
                for (const [dr, dc] of [[-1, -1], [-1, 1], [1, -1], [1, 1]]) {
                    const nr = mv.toR + dr, nc = mv.toC + dc;
                    const jr = mv.toR - dr, jc = mv.toC - dc;
                    if (inBoard(nr, nc) && inBoard(jr, jc) && board[nr][nc] && board[nr][nc].color === enemy && !board[jr][jc]) {
                        safe = false;
                    }
                }
                if (safe) score += 25;
                score += (4 - Math.abs(mv.toC - 4)) * 2;
                score += Math.random() * 20;

                if (score > bestScore) {
                    bestScore = score;
                    bestMoves = [mv];
                } else if (Math.abs(score - bestScore) < 25) {
                    bestMoves.push(mv);
                }
            }
            const chosen = bestMoves[Math.floor(Math.random() * bestMoves.length)];
            executeCheckersJump(chosen.fromR, chosen.fromC, chosen.toR, chosen.toC);
        }

        // ---- 将棋 AI ----
        function aiShogiMove(color) {
            const allMoves = [];
            // 1) 棋盘棋子走法
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    const p = board[r][c];
                    if (p && p.color === color) {
                        const moves = getLegalMoves(board, r, c);
                        for (const m of moves) {
                            allMoves.push({ fromR: r, fromC: c, toR: m.row, toC: m.col, drop: false, dropType: null });
                        }
                    }
                }
            }
            // 2) 手持棋子打入
            const drops = generateShogiDrops(board, color);
            for (const d of drops) {
                allMoves.push({ fromR: -1, fromC: -1, toR: d.row, toC: d.col, drop: true, dropType: d.dropType });
            }

            if (allMoves.length === 0) return;

            let bestScore = -Infinity;
            let bestMoves = [];

            for (const mv of allMoves) {
                const sim = cloneBoard(board);
                // 保存手持快照（不可变，仅用于恢复）
                const handSaved = {};
                for (const t in shogiHand[color]) handSaved[t] = shogiHand[color][t];
                // 模拟手持（可变副本）
                const handSim = {};
                for (const t in shogiHand[color]) handSim[t] = shogiHand[color][t];

                if (mv.drop) {
                    // 模拟打入
                    if (handSim[mv.dropType]) {
                        handSim[mv.dropType]--;
                        if (handSim[mv.dropType] === 0) delete handSim[mv.dropType];
                    }
                    const isShogiType = SHOGI_NAMES[mv.dropType] !== undefined;
                    sim[mv.toR][mv.toC] = { color, type: mv.dropType, promoted: isShogiType && inShogiPromoZone(color, mv.toR) && mv.dropType !== 'shogi-king' && mv.dropType !== 'shogi-gold' };
                } else {
                    // 模拟走子
                    const captured = sim[mv.toR][mv.toC];
                    sim[mv.toR][mv.toC] = sim[mv.fromR][mv.fromC];
                    sim[mv.fromR][mv.fromC] = null;
                    // 升变
                    const piece = sim[mv.toR][mv.toC];
                    if (canShogiPromote(sim[mv.toR][mv.toC], mv.fromR, mv.toR)) {
                        sim[mv.toR][mv.toC] = { ...piece, promoted: true };
                    }
                    // 模拟吃子进手持
                    if (captured) {
                        const base = shogiBaseType(captured.type);
                        if (!handSim[base]) handSim[base] = 0;
                        handSim[base]++;
                    }
                }

                // 评估
                let score = evaluateBoard(sim, color);
                // 手持棋子价值（按半价估算）
                for (const t in handSim) {
                    const val = AI_VALUE[t] || 50;
                    const bonus = (mv.drop && mv.dropType === t) ? 0 : val * 0.5;
                    if (handSim[t] > 0) score += bonus * handSim[t];
                }
                // 打入额外奖励（落子靠近中央/敌方）
                if (mv.drop) {
                    score += (4 - Math.abs(mv.toC - 4)) * 3;
                    score += (mv.toR >= 5 ? (9 - mv.toR) : mv.toR) * 2; // 偏中间行
                }
                score += Math.random() * 20;

                // 恢复手持（从不可变快照）
                for (const t in shogiHand[color]) {
                    if (!(t in handSaved)) delete shogiHand[color][t];
                }
                for (const t in handSaved) {
                    shogiHand[color][t] = handSaved[t];
                }

                if (score > bestScore) {
                    bestScore = score;
                    bestMoves = [mv];
                } else if (Math.abs(score - bestScore) < 25) {
                    bestMoves.push(mv);
                }
            }

            const chosen = bestMoves[Math.floor(Math.random() * bestMoves.length)];
            if (chosen.drop) {
                executeShogiDrop(chosen.toR, chosen.toC, chosen.dropType);
            } else {
                makeMove(chosen.fromR, chosen.fromC, chosen.toR, chosen.toC);
            }
        }

        function updateShogiHandUI() {
            const area = document.getElementById('shogiHandArea');
            const color = currentTurn;
            const hand = shogiHand[color] || {};
            const entries = Object.entries(hand).filter(([, c]) => c > 0);
            if (!isShogi(color) || entries.length === 0) {
                area.classList.remove('visible');
                area.innerHTML = '';
                return;
            }
            area.classList.add('visible');
            area.innerHTML = entries.map(([type, count]) => {
                const name = shogiHandDisplayName(type);
                const sel = (selectedHandPiece === type) ? ' selected' : '';
                return `<span class="shogi-hand-piece${sel}" data-type="${type}">${name}<span class="hand-count">${count}</span></span>`;
            }).join('');
            // 绑定点击事件
            area.querySelectorAll('.shogi-hand-piece').forEach(el => {
                el.addEventListener('click', (e) => {
                    e.stopPropagation();
                    if (gameOver) return;
                    const t = el.dataset.type;
                    if (selectedHandPiece === t) {
                        selectedHandPiece = null;
                        selectedPos = null;
                        validMoves = [];
                    } else {
                        selectedHandPiece = t;
                        selectedPos = null;
                        validMoves = generateShogiDrops(board, currentTurn).filter(d => d.dropType === t);
                    }
                    updateShogiHandUI();
                    drawBoard();
                    if (selectedHandPiece) {
                        statusBar.textContent = `打入「${SHOGI_NAMES[selectedHandPiece]}」· 点击空位放置`;
                    } else {
                        statusBar.textContent = `${currentTurn === 'red' ? '红方' : '黑方'}（将棋）走棋或打入`;
                    }
                });
            });
        }

        function getShogiPieceName(piece) {
            if (!piece) return '';
            if (piece.promoted) return SHOGI_PROMOTED_NAMES[piece.type] || SHOGI_NAMES[piece.type] || piece.type;
            return SHOGI_NAMES[piece.type] || piece.type;
        }
        // 手持棋子显示名（包括非将棋类型）
        function shogiHandDisplayName(type) {
            if (SHOGI_NAMES[type]) return SHOGI_NAMES[type];
            if (XIANGQI_NAMES_RED[type]) return XIANGQI_NAMES_RED[type];
            if (CHESS_SYMBOLS[type]) return CHESS_SYMBOLS[type];
            if (type === 'go-stone') return '围';
            if (type === 'gomoku-stone') return '五';
            return type;
        }

        function executeShogiDrop(row, col, type) {
            const color = currentTurn;
            removeFromHand(color, type);
            // 围棋/五子棋属于放置类棋子，无移动能力
            const isStone = type === 'go-stone' || type === 'gomoku-stone';
            const isShogiType = !isStone && SHOGI_NAMES[type] !== undefined;
            board[row][col] = { color, type, promoted: false };
            // 打入自动升变（仅将棋类型）
            if (isShogiType && inShogiPromoZone(color, row) && type !== 'shogi-king' && type !== 'shogi-gold') {
                board[row][col].promoted = true;
            }
            moveHistory.push({ drop: true, row, col, type, color });
            selectedHandPiece = null;
            selectedPos = null;
            validMoves = [];
            drawBoard();
            // 放置类棋子触发气/提子
            resolveCaptures(board, color);
            const over = switchTurn();
            if (!over) {
                drawBoard();
                if (isStone) {
                    statusBar.textContent = `${color === 'red' ? '红方' : '黑方'} 放置${type === 'go-stone' ? '围棋子' : '五子棋子'} · 将棋走棋或打入`;
                } else {
                    statusBar.textContent = `${color === 'red' ? '红方' : '黑方'}（将棋）走棋或打入`;
                }
            }
        }

        function updateTurnUI() {
            turnLabel.textContent = currentTurn === 'red' ? '红方走' : '黑方走';
            turnDot.className = 'turn-dot ' + currentTurn;
            // 围棋方 / 五子棋方剩余储备子数显示
            const parts = [];
            if (isGo('red') && goReserve.red > 0) {
                parts.push(`<span class="reserve-dot red"></span>红方围棋剩余 <b>${goReserve.red}</b> 颗`);
            }
            if (isGomoku('red') && goReserve.red > 0) {
                parts.push(`<span class="reserve-dot red"></span>红方五子棋剩余 <b>${goReserve.red}</b> 颗`);
            }
            if (isGo('blue') && goReserve.blue > 0) {
                parts.push(`<span class="reserve-dot blue"></span>黑方围棋剩余 <b>${goReserve.blue}</b> 颗`);
            }
            if (isGomoku('blue') && goReserve.blue > 0) {
                parts.push(`<span class="reserve-dot blue"></span>黑方五子棋剩余 <b>${goReserve.blue}</b> 颗`);
            }
            if (parts.length > 0) {
                goReserveInfo.innerHTML = parts.join('　');
                goReserveInfo.classList.add('visible');
            } else {
                goReserveInfo.classList.remove('visible');
                goReserveInfo.innerHTML = '';
            }
            updateShogiHandUI();
        }

        // ===== 配置面板交互 =====
        const configMask = document.getElementById('configMask');
        const redSel = document.getElementById('redRuleset');
        const blueSel = document.getElementById('blueRuleset');
        const aiSel = document.getElementById('aiSelect');

        function openConfig() {
            redSel.value = config.rulesets.red;
            blueSel.value = config.rulesets.blue;
            aiSel.value = aiPlayer;
            configMask.classList.remove('hidden');
        }
        function closeConfig() { configMask.classList.add('hidden'); }
        function startFromConfig() {
            config.rulesets.red = redSel.value;
            config.rulesets.blue = blueSel.value;
            aiPlayer = aiSel.value;
            closeConfig();
            resetGame();
        }

        // ============================================================
        // 交互逻辑
        // ============================================================

        function handleCanvasClick(e) {
            if (gameOver) return;
            const rect = canvas.getBoundingClientRect();
            const clientX = e.clientX != null ? e.clientX : (e.touches && e.touches[0] && e.touches[0].clientX);
            const clientY = e.clientY != null ? e.clientY : (e.touches && e.touches[0] && e.touches[0].clientY);
            if (clientX == null || clientY == null) return;

            const x = clientX - rect.left;
            const y = clientY - rect.top;

            let col = Math.round((x - margin) / cellSize);
            let row = Math.round((y - margin) / cellSize);
            if (col < 0 || col >= COLS || row < 0 || row >= ROWS) return;

            // 围棋方：点击空位落子
            if (isGo(currentTurn)) {
                if (board[row][col]) {
                    statusBar.textContent = '该位置已有棋子';
                    return;
                }
                if (goReserve[currentTurn] <= 0) {
                    statusBar.textContent = '围棋方储备已空，自动跳过';
                    return;
                }
                if (isGoSuicide(board, row, col, currentTurn)) {
                    statusBar.textContent = '自杀禁手：该位置落子后无气且不能吃子';
                    return;
                }
                placeGoStone(row, col);
                return;
            }

            // 五子棋方：点击空位落子
            if (isGomoku(currentTurn)) {
                if (board[row][col]) {
                    statusBar.textContent = '该位置已有棋子';
                    return;
                }
                if (goReserve[currentTurn] <= 0) {
                    statusBar.textContent = '五子棋方储备已空，自动跳过';
                    return;
                }
                placeGomokuStone(row, col);
                return;
            }

            // 跳棋方：连跳中途继续跳
            if (isCheckers(currentTurn) && midJumpPos) {
                const isTarget = validMoves.some(m => m.row === row && m.col === col);
                if (!isTarget) {
                    statusBar.textContent = '必须继续跳吃，点击高亮位置';
                    return;
                }
                executeCheckersJump(midJumpPos.row, midJumpPos.col, row, col);
                return;
            }

            // 跳棋方：正常走棋
            if (isCheckers(currentTurn)) {
                const piece = board[row][col];
                const hasJump = checkersHasAnyJump(board, currentTurn);

                // 已选中棋子
                if (selectedPos) {
                    const isTarget = validMoves.some(m => m.row === row && m.col === col);
                    if (isTarget) {
                        executeCheckersJump(selectedPos.row, selectedPos.col, row, col);
                        return;
                    }
                    // 换选自己的其他棋子
                    if (piece && piece.color === currentTurn) {
                        selectCheckersPiece(row, col, piece, hasJump);
                        return;
                    }
                    // 取消选择
                    selectedPos = null;
                    validMoves = [];
                    midJumpPos = null;
                    drawBoard();
                    statusBar.textContent = hasJump ? `${currentTurn === 'red' ? '红方' : '黑方'}（跳棋）必须跳吃` : `${currentTurn === 'red' ? '红方' : '黑方'}（跳棋）走棋`;
                    return;
                }

                // 选中己方棋子
                if (piece && piece.color === currentTurn) {
                    selectCheckersPiece(row, col, piece, hasJump);
                    return;
                }
                statusBar.textContent = hasJump ? `必须跳吃！请选择能跳吃的棋子` : `请选择 ${currentTurn === 'red' ? '红方' : '黑方'} 棋子`;
                return;
            }

            // ---- 将棋方：手持棋子打入 (点击空位) ----
            if (isShogi(currentTurn) && selectedHandPiece) {
                if (!board[row][col]) {
                    const dropTarget = validMoves.find(m => m.row === row && m.col === col);
                    if (dropTarget) {
                        executeShogiDrop(row, col, selectedHandPiece);
                        return;
                    }
                    statusBar.textContent = '此处不可打入，请选其他空位';
                    return;
                }
                // 点击己方棋子 -> 切换为棋盘棋子
                if (board[row][col].color === currentTurn) {
                    selectedHandPiece = null;
                    updateShogiHandUI();
                    selectedPos = { row, col };
                    validMoves = getLegalMoves(board, row, col);
                    drawBoard();
                    return;
                }
                // 点击对方棋子 -> 取消
                selectedHandPiece = null;
                updateShogiHandUI();
                validMoves = [];
                drawBoard();
                return;
            }

            // ---- 将棋方：普通走棋 (已选中棋盘棋子) ----
            if (isShogi(currentTurn) && selectedPos) {
                const isTarget = validMoves.some(m => m.row === row && m.col === col);
                if (isTarget) {
                    makeMove(selectedPos.row, selectedPos.col, row, col);
                    return;
                }
                if (board[row][col] && board[row][col].color === currentTurn) {
                    selectedPos = { row, col };
                    validMoves = getLegalMoves(board, row, col);
                    drawBoard();
                    return;
                }
                selectedPos = null;
                selectedHandPiece = null;
                updateShogiHandUI();
                validMoves = [];
                drawBoard();
                return;
            }

            // ---- 将棋方：无选中 -> 选棋盘棋子 ----
            if (isShogi(currentTurn)) {
                if (board[row][col] && board[row][col].color === currentTurn) {
                    selectedHandPiece = null;
                    updateShogiHandUI();
                    selectedPos = { row, col };
                    validMoves = getLegalMoves(board, row, col);
                    drawBoard();
                    return;
                }
                return;
            }

            const piece = board[row][col];

            // 如果已经选中了一个棋子
            if (selectedPos) {
                // 检查是否点击了合法走法
                const isTarget = validMoves.some(m => m.row === row && m.col === col);
                if (isTarget) {
                    // 执行移动
                    makeMove(selectedPos.row, selectedPos.col, row, col);
                    return;
                }

                // 点击了自己的另一个棋子 -> 切换选择
                if (piece && piece.color === currentTurn) {
                    selectedPos = { row, col };
                    validMoves = getLegalMoves(board, row, col);
                    drawBoard();
                    if (validMoves.length === 0) {
                        statusBar.textContent = '该棋子无合法走法';
                    } else {
                        statusBar.textContent = `已选择 ${piece.color === 'red' ? '红' : '黑'}${piece.type}，点击高亮位置移动`;
                    }
                    return;
                }

                // 点击其他位置 -> 取消选择
                selectedPos = null;
                validMoves = [];
                drawBoard();
                statusBar.textContent = `${currentTurn === 'red' ? '红方' : '黑方'} 走棋`;
                return;
            }

            // 没有选中任何棋子
            if (piece && piece.color === currentTurn) {
                const moves = getLegalMoves(board, row, col);
                if (moves.length === 0) {
                    statusBar.textContent = '该棋子无合法走法';
                    return;
                }
                selectedPos = { row, col };
                validMoves = moves;
                drawBoard();
                statusBar.textContent = `已选择 ${piece.color === 'red' ? '红' : '黑'}${piece.type}，点击高亮位置移动`;
            } else {
                statusBar.textContent = `请选择 ${currentTurn === 'red' ? '红方' : '黑方'} 棋子`;
            }
        }

        // ============================================================
        // 绘制
        // ============================================================

        function resizeCanvas() {
            const wrapper = canvas.parentElement;
            const wrapperWidth = wrapper.clientWidth || 400;
            // 棋盘宽高比 = 8:9 (因为9列10行交叉点)
            const targetWidth = Math.min(wrapperWidth, 600);
            const targetHeight = targetWidth * 9 / 8;
            canvas.style.width = targetWidth + 'px';
            canvas.style.height = targetHeight + 'px';

            // 实际像素尺寸（用2倍清晰度）
            const dpr = window.devicePixelRatio || 1;
            const logicalWidth = targetWidth;
            const logicalHeight = targetHeight;
            canvas.width = logicalWidth * dpr;
            canvas.height = logicalHeight * dpr;
            canvas.style.width = logicalWidth + 'px';
            canvas.style.height = logicalHeight + 'px';
            ctx.scale(dpr, dpr);

            canvasWidth = logicalWidth;
            canvasHeight = logicalHeight;

            // 计算格子大小
            const padding = 20;
            const maxCellW = (logicalWidth - padding * 2) / 8;
            const maxCellH = (logicalHeight - padding * 2) / 9;
            cellSize = Math.min(maxCellW, maxCellH);
            margin = (logicalWidth - cellSize * 8) / 2;
            // 调整margin使得棋盘垂直居中
            const boardH = cellSize * 9;
            const marginV = (logicalHeight - boardH) / 2;
            // 使用统一的margin
            margin = Math.min(margin, marginV);
            // 重新计算实际使用的大小
            boardPixelWidth = cellSize * 8;
            boardPixelHeight = cellSize * 9;
            // 重新调整margin使棋盘居中
            margin = (logicalWidth - boardPixelWidth) / 2;

            drawBoard();
        }

        function getPos(row, col) {
            return {
                x: margin + col * cellSize,
                y: margin + row * cellSize
            };
        }

        function drawBoard() {
            const w = canvasWidth;
            const h = canvasHeight;
            ctx.clearRect(0, 0, w, h);

            // 背景
            const grad = ctx.createLinearGradient(0, 0, w, h);
            grad.addColorStop(0, '#d4b48c');
            grad.addColorStop(1, '#c4a47c');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, w, h);

            // 楚河汉界河流背景（行4到行5之间的横带）
            const riverTop = margin + 4 * cellSize;
            const riverBottom = margin + 5 * cellSize;
            const riverLeft = margin;
            const riverRight = margin + 8 * cellSize;
            const riverGrad = ctx.createLinearGradient(0, riverTop, 0, riverBottom);
            riverGrad.addColorStop(0, '#8ec5e8');
            riverGrad.addColorStop(0.5, '#6aa6d6');
            riverGrad.addColorStop(1, '#8ec5e8');
            ctx.fillStyle = riverGrad;
            ctx.fillRect(riverLeft, riverTop, riverRight - riverLeft, riverBottom - riverTop);

            // 绘制网格线
            ctx.strokeStyle = '#5a3a2a';
            ctx.lineWidth = 1.2;

            // 竖线 (列0-8)
            for (let c = 0; c < COLS; c++) {
                const x = margin + c * cellSize;
                const yTop = margin;
                const yBottom = margin + 9 * cellSize;
                // 楚河汉界处断开
                if (c === 0 || c === COLS - 1) {
                    ctx.beginPath();
                    ctx.moveTo(x, yTop);
                    ctx.lineTo(x, yBottom);
                    ctx.stroke();
                } else {
                    // 上半
                    ctx.beginPath();
                    ctx.moveTo(x, yTop);
                    ctx.lineTo(x, margin + 4 * cellSize);
                    ctx.stroke();
                    // 下半
                    ctx.beginPath();
                    ctx.moveTo(x, margin + 5 * cellSize);
                    ctx.lineTo(x, yBottom);
                    ctx.stroke();
                }
            }

            // 横线 (行0-9)
            for (let r = 0; r < ROWS; r++) {
                const y = margin + r * cellSize;
                const xLeft = margin;
                const xRight = margin + 8 * cellSize;
                ctx.beginPath();
                ctx.moveTo(xLeft, y);
                ctx.lineTo(xRight, y);
                ctx.stroke();
            }

            // 九宫格斜线
            // 红方 (行7-9, 列3-5)
            ctx.beginPath();
            ctx.moveTo(margin + 3 * cellSize, margin + 7 * cellSize);
            ctx.lineTo(margin + 5 * cellSize, margin + 9 * cellSize);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(margin + 5 * cellSize, margin + 7 * cellSize);
            ctx.lineTo(margin + 3 * cellSize, margin + 9 * cellSize);
            ctx.stroke();

            // 黑方 (行0-2, 列3-5)
            ctx.beginPath();
            ctx.moveTo(margin + 3 * cellSize, margin + 0 * cellSize);
            ctx.lineTo(margin + 5 * cellSize, margin + 2 * cellSize);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(margin + 5 * cellSize, margin + 0 * cellSize);
            ctx.lineTo(margin + 3 * cellSize, margin + 2 * cellSize);
            ctx.stroke();

            // 楚河汉界
            const midY = margin + 4.5 * cellSize;
            ctx.fillStyle = '#3a2a1a';
            ctx.font = `bold ${cellSize * 0.5}px "KaiTi", "STKaiti", serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('楚  河', margin + 2 * cellSize, midY);
            ctx.fillText('汉  界', margin + 6 * cellSize, midY);

            // 绘制所有棋子
            for (let r = 0; r < ROWS; r++) {
                if (!board[r]) continue;
                for (let c = 0; c < COLS; c++) {
                    const piece = board[r][c];
                    if (piece) {
                        drawPiece(r, c, piece);
                    }
                }
            }

            // 绘制高亮（走法提示）
            for (const m of validMoves) {
                const pos = getPos(m.row, m.col);
                const target = board[m.row][m.col];
                if (target) {
                    // 可吃子：红色圆圈
                    ctx.beginPath();
                    ctx.arc(pos.x, pos.y, cellSize * 0.42, 0, Math.PI * 2);
                    ctx.fillStyle = 'rgba(255, 50, 50, 0.35)';
                    ctx.fill();
                    ctx.strokeStyle = 'rgba(255, 50, 50, 0.7)';
                    ctx.lineWidth = 2.5;
                    ctx.stroke();
                } else {
                    // 可走位置：绿色圆点
                    ctx.beginPath();
                    ctx.arc(pos.x, pos.y, cellSize * 0.18, 0, Math.PI * 2);
                    ctx.fillStyle = 'rgba(50, 200, 50, 0.6)';
                    ctx.fill();
                    ctx.strokeStyle = 'rgba(50, 200, 50, 0.8)';
                    ctx.lineWidth = 1.5;
                    ctx.stroke();
                }
            }

            // 选中棋子高亮
            if (selectedPos) {
                const pos = getPos(selectedPos.row, selectedPos.col);
                ctx.beginPath();
                ctx.arc(pos.x, pos.y, cellSize * 0.46, 0, Math.PI * 2);
                ctx.strokeStyle = '#ffd700';
                ctx.lineWidth = 3;
                ctx.stroke();
                ctx.beginPath();
                ctx.arc(pos.x, pos.y, cellSize * 0.42, 0, Math.PI * 2);
                ctx.strokeStyle = 'rgba(255, 215, 0, 0.3)';
                ctx.lineWidth = 6;
                ctx.stroke();
            }

            // 游戏结束遮罩
            if (gameOver && winner) {
                // 半透明遮罩
                ctx.fillStyle = 'rgba(0, 0, 0, 0.65)';
                ctx.fillRect(0, 0, w, h);

                // 胜利面板
                const panelW = cellSize * 6.5;
                const panelH = cellSize * 3.8;
                const panelX = (w - panelW) / 2;
                const panelY = (h - panelH) / 2;
                const panelR = cellSize * 0.4;

                // 面板背景（带圆角）
                ctx.shadowColor = 'rgba(0, 0, 0, 0.5)';
                ctx.shadowBlur = 20;
                ctx.shadowOffsetX = 0;
                ctx.shadowOffsetY = 4;
                const panelGrad = ctx.createLinearGradient(panelX, panelY, panelX, panelY + panelH);
                panelGrad.addColorStop(0, winner === 'red' ? '#6b2020' : '#2a2a3a');
                panelGrad.addColorStop(1, winner === 'red' ? '#3a1010' : '#12121e');
                ctx.fillStyle = panelGrad;
                ctx.beginPath();
                ctx.moveTo(panelX + panelR, panelY);
                ctx.lineTo(panelX + panelW - panelR, panelY);
                ctx.arcTo(panelX + panelW, panelY, panelX + panelW, panelY + panelR, panelR);
                ctx.lineTo(panelX + panelW, panelY + panelH - panelR);
                ctx.arcTo(panelX + panelW, panelY + panelH, panelX + panelW - panelR, panelY + panelH, panelR);
                ctx.lineTo(panelX + panelR, panelY + panelH);
                ctx.arcTo(panelX, panelY + panelH, panelX, panelY + panelH - panelR, panelR);
                ctx.lineTo(panelX, panelY + panelR);
                ctx.arcTo(panelX, panelY, panelX + panelR, panelY, panelR);
                ctx.closePath();
                ctx.fill();

                // 面板边框
                ctx.shadowBlur = 0;
                ctx.strokeStyle = winner === 'red' ? '#e84040' : '#6688cc';
                ctx.lineWidth = 2.5;
                ctx.stroke();

                // 内边框
                ctx.strokeStyle = 'rgba(255, 215, 0, 0.4)';
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(panelX + panelR + 8, panelY + 8);
                ctx.lineTo(panelX + panelW - panelR - 8, panelY + 8);
                ctx.arcTo(panelX + panelW - 8, panelY + 8, panelX + panelW - 8, panelY + panelR + 8, panelR - 8);
                ctx.lineTo(panelX + panelW - 8, panelY + panelH - panelR - 8);
                ctx.arcTo(panelX + panelW - 8, panelY + panelH - 8, panelX + panelW - panelR - 8, panelY + panelH - 8, panelR - 8);
                ctx.lineTo(panelX + panelR + 8, panelY + panelH - 8);
                ctx.arcTo(panelX + 8, panelY + panelH - 8, panelX + 8, panelY + panelH - panelR - 8, panelR - 8);
                ctx.lineTo(panelX + 8, panelY + panelR + 8);
                ctx.arcTo(panelX + 8, panelY + 8, panelX + panelR + 8, panelY + 8, panelR - 8);
                ctx.closePath();
                ctx.stroke();

                // 冠军奖杯
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.font = `${cellSize * 1.0}px "Segoe UI Symbol", "Apple Color Emoji", sans-serif`;
                ctx.fillStyle = '#ffd700';
                ctx.fillText('🏆', panelX + panelW / 2, panelY + cellSize * 0.7);

                // 胜利标题
                const colorName = winner === 'red' ? '红方' : '黑方';
                ctx.font = `bold ${cellSize * 0.55}px "PingFang SC", "Microsoft YaHei", sans-serif`;
                ctx.fillStyle = '#ffd700';
                ctx.fillText(`${colorName}获胜`, panelX + panelW / 2, panelY + cellSize * 1.5);

                // 规则体系
                ctx.font = `${cellSize * 0.35}px "PingFang SC", "Microsoft YaHei", sans-serif`;
                ctx.fillStyle = winner === 'red' ? '#f0a0a0' : '#a0b8e0';
                ctx.fillText(rulesetName(winner), panelX + panelW / 2, panelY + cellSize * 2.05);

                // 胜利原因
                ctx.font = `${cellSize * 0.4}px "PingFang SC", "Microsoft YaHei", sans-serif`;
                ctx.fillStyle = '#f0e0c0';
                ctx.fillText(victoryReason, panelX + panelW / 2, panelY + cellSize * 2.6);

                // 底部提示
                ctx.font = `${cellSize * 0.3}px "PingFang SC", "Microsoft YaHei", sans-serif`;
                ctx.fillStyle = 'rgba(255, 255, 255, 0.5)';
                ctx.fillText('点击「新局」重新开始', panelX + panelW / 2, panelY + cellSize * 3.2);

                // 重置阴影
                ctx.shadowBlur = 0;
                ctx.shadowOffsetX = 0;
                ctx.shadowOffsetY = 0;
            }
        }

        function drawCross(x, y, size) {
            ctx.strokeStyle = '#5a3a2a';
            ctx.lineWidth = 1.2;
            const s = size;
            // 横
            ctx.beginPath();
            ctx.moveTo(x - s, y);
            ctx.lineTo(x + s, y);
            ctx.stroke();
            // 竖
            ctx.beginPath();
            ctx.moveTo(x, y - s);
            ctx.lineTo(x, y + s);
            ctx.stroke();
            // 小斜角
            const d = s * 0.3;
            ctx.beginPath();
            ctx.moveTo(x - s, y - d);
            ctx.lineTo(x - s + d, y - s);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(x + s, y - d);
            ctx.lineTo(x + s - d, y - s);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(x - s, y + d);
            ctx.lineTo(x - s + d, y + s);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(x + s, y + d);
            ctx.lineTo(x + s - d, y + s);
            ctx.stroke();
        }

        function drawPiece(row, col, piece) {
            const pos = getPos(row, col);
            const x = pos.x,
                y = pos.y;
            const radius = cellSize * 0.42;
            const isRed = piece.color === 'red';

            // 围棋子：画实心圆，无文字
            if (piece.type === 'go-stone') {
                ctx.shadowColor = 'rgba(0,0,0,0.4)';
                ctx.shadowBlur = 5;
                ctx.shadowOffsetX = 1;
                ctx.shadowOffsetY = 2;
                const grad = ctx.createRadialGradient(x - radius * 0.3, y - radius * 0.3, radius * 0.1, x, y, radius);
                if (isRed) {
                    grad.addColorStop(0, '#ff6060');
                    grad.addColorStop(0.6, '#d02020');
                    grad.addColorStop(1, '#700000');
                } else {
                    grad.addColorStop(0, '#808090');
                    grad.addColorStop(0.6, '#303040');
                    grad.addColorStop(1, '#000010');
                }
                ctx.beginPath();
                ctx.arc(x, y, radius, 0, Math.PI * 2);
                ctx.fillStyle = grad;
                ctx.fill();
                ctx.shadowBlur = 0;
                ctx.shadowOffsetX = 0;
                ctx.shadowOffsetY = 0;
                ctx.strokeStyle = isRed ? 'rgba(255,180,180,0.6)' : 'rgba(180,180,200,0.6)';
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                ctx.arc(x, y, radius, 0, Math.PI * 2);
                ctx.stroke();
                return;
            }

            // 五子棋子：画实心圆 + 小十字标记，区分于围棋
            if (piece.type === 'gomoku-stone') {
                ctx.shadowColor = 'rgba(0,0,0,0.4)';
                ctx.shadowBlur = 5;
                ctx.shadowOffsetX = 1;
                ctx.shadowOffsetY = 2;
                const grad = ctx.createRadialGradient(x - radius * 0.3, y - radius * 0.3, radius * 0.1, x, y, radius);
                if (isRed) {
                    grad.addColorStop(0, '#ffb0a0');
                    grad.addColorStop(0.6, '#e06040');
                    grad.addColorStop(1, '#801800');
                } else {
                    grad.addColorStop(0, '#707080');
                    grad.addColorStop(0.6, '#202030');
                    grad.addColorStop(1, '#000008');
                }
                ctx.beginPath();
                ctx.arc(x, y, radius, 0, Math.PI * 2);
                ctx.fillStyle = grad;
                ctx.fill();
                ctx.shadowBlur = 0;
                ctx.shadowOffsetX = 0;
                ctx.shadowOffsetY = 0;
                ctx.strokeStyle = isRed ? 'rgba(255,200,150,0.7)' : 'rgba(150,150,180,0.7)';
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                ctx.arc(x, y, radius, 0, Math.PI * 2);
                ctx.stroke();
                // 小十字标记（五子棋特色）
                const cs = radius * 0.3;
                ctx.strokeStyle = isRed ? 'rgba(255,220,200,0.5)' : 'rgba(200,200,220,0.5)';
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(x - cs, y);
                ctx.lineTo(x + cs, y);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(x, y - cs);
                ctx.lineTo(x, y + cs);
                ctx.stroke();
                return;
            }

            // 阴影
            ctx.shadowColor = 'rgba(0,0,0,0.3)';
            ctx.shadowBlur = 6;
            ctx.shadowOffsetX = 2;
            ctx.shadowOffsetY = 2;

            // 棋子圆形
            const grad = ctx.createRadialGradient(x - radius * 0.3, y - radius * 0.3, radius * 0.1, x, y, radius);
            if (isRed) {
                grad.addColorStop(0, '#f06060');
                grad.addColorStop(0.7, '#c02020');
                grad.addColorStop(1, '#801010');
            } else {
                grad.addColorStop(0, '#555');
                grad.addColorStop(0.7, '#222');
                grad.addColorStop(1, '#000');
            }
            ctx.beginPath();
            ctx.arc(x, y, radius, 0, Math.PI * 2);
            ctx.fillStyle = grad;
            ctx.fill();

            // 边框
            ctx.shadowBlur = 0;
            ctx.shadowOffsetX = 0;
            ctx.shadowOffsetY = 0;
            ctx.strokeStyle = isRed ? '#ffcc88' : '#aaa';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(x, y, radius, 0, Math.PI * 2);
            ctx.stroke();

            // 内圈
            ctx.strokeStyle = isRed ? 'rgba(255,220,180,0.5)' : 'rgba(200,200,200,0.4)';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.arc(x, y, radius * 0.78, 0, Math.PI * 2);
            ctx.stroke();

            // 文字
            ctx.shadowBlur = 0;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            let text = '';
            let fontSize = radius * 0.75;

            const isShogiPiece = piece.type && piece.type.startsWith('shogi-');
            const isXiangqiPiece = piece.type && piece.type.startsWith('xiangqi-') || ['advisor', 'elephant', 'horse', 'cannon'].includes(piece.type);
            if (isShogiPiece) {
                // 将棋：用汉字显示，升变后换字
                text = piece.promoted ? (SHOGI_PROMOTED_NAMES[piece.type] || SHOGI_NAMES[piece.type] || piece.type) : (SHOGI_NAMES[piece.type] || piece.type);
                fontSize = radius * 0.7;
                ctx.fillStyle = isRed ? '#ffeedd' : '#f0f0f0';
                ctx.shadowColor = isRed ? 'rgba(0,0,0,0.5)' : 'rgba(255,255,255,0.3)';
                ctx.shadowBlur = 4;
                ctx.shadowOffsetX = 1;
                ctx.shadowOffsetY = 1;
            } else if (isXiangqiPiece) {
                text = (isRed ? XIANGQI_NAMES_RED : XIANGQI_NAMES_BLUE)[piece.type] || piece.type;
                ctx.fillStyle = isRed ? '#ffeedd' : '#f0f0f0';
                ctx.shadowColor = isRed ? 'rgba(0,0,0,0.5)' : 'rgba(255,255,255,0.3)';
                ctx.shadowBlur = 4;
                ctx.shadowOffsetX = 1;
                ctx.shadowOffsetY = 1;
            } else {
                // 使用国际象棋规则：优先用Unicode符号，不支持则回退字母
                const sym = CHESS_SYMBOLS[piece.type];
                ctx.font = `bold ${fontSize}px "Segoe UI Symbol", "Arial Unicode MS", sans-serif`;
                const metrics = ctx.measureText(sym);
                if (metrics.width < fontSize * 0.3) {
                    text = CHESS_LETTERS[piece.type] || piece.type;
                } else {
                    text = sym;
                }
                ctx.fillStyle = isRed ? '#fff0f0' : '#f0f0f0';
                ctx.shadowColor = isRed ? 'rgba(20,0,0,0.5)' : 'rgba(255,255,255,0.3)';
                ctx.shadowBlur = 4;
                ctx.shadowOffsetX = 1;
                ctx.shadowOffsetY = 1;
            }

            // 对于国际象棋Unicode符号，使用更大的字体
            if (!isXiangqiPiece && !isShogiPiece && text.length === 1 && text.charCodeAt(0) > 0x2600) {
                ctx.font = `bold ${fontSize * 1.1}px "Segoe UI Symbol", "Arial Unicode MS", sans-serif`;
            } else {
                ctx.font = `bold ${fontSize}px "PingFang SC", "Microsoft YaHei", "Segoe UI Symbol", "Arial Unicode MS", sans-serif`;
            }
            ctx.fillText(text, x, y + (isXiangqiPiece ? 1 : 0));

            // 重置阴影
            ctx.shadowBlur = 0;
            ctx.shadowOffsetX = 0;
            ctx.shadowOffsetY = 0;
        }

        // ============================================================
        // 事件绑定与初始化
        // ============================================================

        canvas.addEventListener('click', handleCanvasClick);
        canvas.addEventListener('touchstart', function(e) {
            e.preventDefault();
            handleCanvasClick(e);
        }, { passive: false });

        document.getElementById('resetBtn').addEventListener('click', resetGame);
        document.getElementById('configBtn').addEventListener('click', openConfig);
        document.getElementById('startBtn').addEventListener('click', startFromConfig);
        // 点击蒙层空白处也可关闭（可选）
        configMask.addEventListener('click', function(e) {
            if (e.target === configMask) closeConfig();
        });

        window.addEventListener('resize', resizeCanvas);

        // 初始化
        function init() {
            board = createInitialBoard();
            currentTurn = 'red'; // 红方永远先手
            selectedPos = null;
            validMoves = [];
            gameOver = false;
            winner = null;
            updateTurnUI();
            const first = `红方（${rulesetName('red')}）`;
            const second = `黑方（${rulesetName('blue')}）`;
            statusBar.textContent = `游戏已加载！${first}先手 vs ${second}后手 · 点击棋子查看走法`;
            resizeCanvas();
            // 首次加载自动弹出规则设置，让用户选谁 vs 谁
            openConfig();
        }

        // 延迟一帧以确保布局完成
        setTimeout(init, 50);

        // 处理窗口方向变化
        window.addEventListener('orientationchange', function() {
            setTimeout(resizeCanvas, 300);
        });

        console.log('🎯 混乱之棋 已加载！');
        console.log('红方（中国象棋）: 帅仕相马车炮兵');
        console.log('黑方（国际象棋）: ♔♕♗♘♖♙');
        console.log('点击棋子查看走法，点击高亮位置移动');
    </script>

</body>
</html>
