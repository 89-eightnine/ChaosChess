<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>混乱之棋</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }
        body {
            background: #2d2416;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            touch-action: manipulation;
            overflow: hidden;
        }
        .game-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 600px;
            padding: 8px;
            background: #3d2b1a;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.7);
            margin: 8px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            padding: 6px 12px;
            color: #f0e0c0;
            font-size: 16px;
            font-weight: bold;
            background: #4d3824;
            border-radius: 10px 10px 0 0;
            flex-wrap: wrap;
            gap: 6px;
        }
        .turn-indicator {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 15px;
        }
        .turn-dot {
            display: inline-block;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            border: 2px solid #f0e0c0;
            flex-shrink: 0;
        }
        .turn-dot.red {
            background: #e03030;
        }
        .turn-dot.blue {
            background: #222;
        }
        .btn-reset {
            padding: 4px 16px;
            background: #7a5a3a;
            border: none;
            border-radius: 20px;
            color: #f0e0c0;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            touch-action: manipulation;
            transition: background 0.2s;
        }
        .btn-reset:active {
            background: #5a3a1a;
        }
        .canvas-wrapper {
            position: relative;
            width: 100%;
            background: #d4b48c;
            border-radius: 0 0 10px 10px;
            overflow: hidden;
            touch-action: none;
        }
        canvas {
            display: block;
            width: 100%;
            height: auto;
            touch-action: none;
            cursor: pointer;
            background: #d4b48c;
        }
        .status-bar {
            width: 100%;
            padding: 6px 12px;
            text-align: center;
            color: #f0e0c0;
            font-size: 14px;
            background: #4d3824;
            border-radius: 0 0 10px 10px;
            min-height: 32px;
        }
        .status-bar .highlight {
            color: #ffd700;
            font-weight: bold;
        }
        .status-bar.victory {
            background: linear-gradient(180deg, #5a3a1a, #3d2b1a);
            color: #ffd700;
            font-size: 15px;
            font-weight: bold;
            letter-spacing: 1px;
        }
        /* ===== 规则配置面板 ===== */
        .config-mask {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 16px;
        }
        .config-mask.hidden { display: none; }
        .config-panel {
            width: 100%;
            max-width: 480px;
            background: #3d2b1a;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.8);
            padding: 24px 20px;
            color: #f0e0c0;
        }
        .config-panel h2 {
            text-align: center;
            margin-bottom: 20px;
            font-size: 22px;
            color: #ffd700;
        }
        .config-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 14px;
            flex-wrap: wrap;
        }
        .config-label {
            font-size: 15px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 6px;
            flex: 1;
            min-width: 80px;
        }
        .config-label .dot {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            border: 1px solid #f0e0c0;
        }
        .config-label .dot.red { background: #e03030; }
        .config-label .dot.blue { background: #222; }
        .config-select {
            flex: 2;
            min-width: 160px;
            padding: 8px 10px;
            font-size: 14px;
            background: #2d2416;
            color: #f0e0c0;
            border: 1.5px solid #7a5a3a;
            border-radius: 8px;
            outline: none;
            font-family: inherit;
            cursor: pointer;
        }
        .config-select:focus {
            border-color: #ffd700;
        }
        .config-pos {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            color: #c0b090;
        }
        .config-buttons {
            display: flex;
            gap: 10px;
            margin-top: 22px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .btn-start {
            padding: 10px 28px;
            background: linear-gradient(180deg, #e03030, #a02020);
            border: 2px solid #ffd700;
            border-radius: 24px;
            color: #fff;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            font-family: inherit;
            transition: transform 0.1s;
        }
        .btn-start:active { transform: scale(0.96); }
        .btn-config-open {
            padding: 4px 12px;
            background: #7a5a3a;
            border: none;
            border-radius: 20px;
            color: #f0e0c0;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            touch-action: manipulation;
        }
        .btn-config-open:active { background: #5a3a1a; }
        .go-reserve-info {
            display: none;
            font-size: 13px;
            padding: 4px 10px;
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 6px;
            white-space: nowrap;
        }
        .go-reserve-info.visible { display: block; }
        .go-reserve-info .reserve-dot {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            vertical-align: middle;
            margin-right: 4px;
        }
        .go-reserve-info .reserve-dot.red { background: #e8403a; }
        .go-reserve-info .reserve-dot.blue { background: #222; border: 1px solid #555; }
        .go-reserve-info b { color: #ffd966; }
        .shogi-hand-area {
            display: none;
            gap: 2px;
            flex-wrap: wrap;
            align-items: center;
            font-size: 12px;
        }
        .shogi-hand-area.visible { display: flex; }
        .shogi-hand-piece {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            background: #2d2416;
            border: 1.5px solid #7a5a3a;
            color: #f0e0c0;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            touch-action: manipulation;
            transition: all 0.15s;
            position: relative;
        }
        .shogi-hand-piece:hover, .shogi-hand-piece.selected {
            border-color: #ffd700;
            background: #4d3824;
            transform: scale(1.1);
        }
        .shogi-hand-piece .hand-count {
            position: absolute;
            top: -4px;
            right: -4px;
            background: #e03030;
            color: #fff;
            border-radius: 50%;
            width: 14px;
            height: 14px;
            font-size: 10px;
            line-height: 14px;
            text-align: center;
        }
        @media (max-width: 480px) {
            .header {
                font-size: 13px;
                padding: 4px 8px;
            }
            .turn-indicator {
                font-size: 13px;
            }
            .turn-dot {
                width: 14px;
                height: 14px;
            }
            .btn-reset {
                font-size: 12px;
                padding: 3px 12px;
            }
            .status-bar {
                font-size: 12px;
                padding: 4px 8px;
                min-height: 26px;
            }
        }
        /* ===== 沙盒模式 ===== */
        .sandbox-wrapper {
            display: none;
            width: 100%;
            max-width: 1100px;
            gap: 6px;
            padding: 4px;
            align-items: flex-start;
        }
        .sandbox-wrapper.active { display: flex; }
        .sandbox-center {
            flex: 1;
            min-width: 300px;
            display: flex;
            justify-content: center;
        }
        .sandbox-center .game-container {
            margin: 4px;
            max-width: 550px;
        }
        .sandbox-panel {
            width: 170px;
            min-width: 140px;
            max-height: 85vh;
            overflow-y: auto;
            background: #3d2b1a;
            border-radius: 12px;
            padding: 8px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.5);
            flex-shrink: 0;
        }
        .sandbox-panel h3 {
            color: #ffd700;
            font-size: 14px;
            text-align: center;
            margin-bottom: 6px;
            padding-bottom: 6px;
            border-bottom: 1px solid #5a3a2a;
        }
        .sandbox-panel.black-panel h3 { color: #aaa; }
        .sb-ruleset-group {
            margin-bottom: 8px;
        }
        .sb-ruleset-label {
            color: #c0b090;
            font-size: 10px;
            font-weight: bold;
            padding: 2px 6px;
            background: rgba(255,255,255,0.05);
            border-radius: 4px;
            margin-bottom: 4px;
            text-align: center;
        }
        .sb-piece-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 3px;
            justify-content: center;
        }
        .sb-piece-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: 2px solid #5a3a2a;
            background: #2d2416;
            color: #f0e0c0;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            touch-action: manipulation;
            transition: all 0.15s;
            position: relative;
        }
        .sb-piece-btn:hover {
            border-color: #c0a060;
            background: #4d3824;
            transform: scale(1.08);
        }
        .sb-piece-btn.selected {
            border-color: #ffd700;
            background: #5a3a2a;
            box-shadow: 0 0 8px rgba(255,215,0,0.5);
            transform: scale(1.12);
        }
        .sb-piece-btn.red-piece { border-color: #a04040; }
        .sb-piece-btn.blue-piece { border-color: #404050; }
        .sb-core-config {
            margin-top: 10px;
            padding-top: 8px;
            border-top: 1px solid #5a3a2a;
        }
        .sb-core-config .config-label {
            font-size: 11px;
            color: #c0b090;
            text-align: center;
            margin-bottom: 4px;
        }
        .sb-core-config select {
            width: 100%;
            padding: 4px 6px;
            font-size: 11px;
            background: #2d2416;
            color: #f0e0c0;
            border: 1px solid #7a5a3a;
            border-radius: 6px;
            outline: none;
            font-family: inherit;
            cursor: pointer;
        }
        .sb-core-config select:focus { border-color: #ffd700; }
        .sb-config-row {
            margin-bottom: 6px;
        }
        .btn-sandbox-start {
            padding: 4px 14px;
            background: linear-gradient(180deg, #e03030, #a02020);
            border: 2px solid #ffd700;
            border-radius: 20px;
            color: #fff;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            font-family: inherit;
        }
        .btn-sandbox-start:active { transform: scale(0.96); }
        .sandbox-status {
            text-align: center;
            color: #f0e0c0;
            font-size: 12px;
            margin-top: 6px;
            min-height: 18px;
        }
        @media (max-width: 800px) {
            .sandbox-wrapper {
                flex-direction: column;
                align-items: center;
            }
            .sandbox-panel {
                width: 100%;
                max-height: none;
                display: flex;
                flex-wrap: wrap;
                gap: 4px;
                padding: 6px;
                justify-content: center;
            }
            .sandbox-panel h3 {
                width: 100%;
                font-size: 12px;
                margin-bottom: 2px;
                padding-bottom: 2px;
            }
            .sb-ruleset-group {
                margin-bottom: 4px;
            }
            .sb-ruleset-label { font-size: 9px; }
            .sb-piece-btn {
                width: 30px;
                height: 30px;
                font-size: 10px;
            }
            .sb-core-config {
                width: 100%;
                display: flex;
                gap: 8px;
                flex-wrap: wrap;
                justify-content: center;
            }
            .sb-core-config .sb-config-row {
                flex: 1;
                min-width: 100px;
            }
            .btn-sandbox-start {
                width: auto;
                padding: 6px 16px;
                font-size: 12px;
            }
        }
    </style>
</head>
<body>

    <!-- 规则配置面板 -->
    <div class="config-mask" id="configMask">
        <div class="config-panel">
            <h2>⚔️ 规则设置</h2>
            <div class="config-row">
                <div class="config-label"><span class="dot red"></span>红方（下方 · 先手）</div>
                <select class="config-select" id="redRuleset">
                    <option value="xiangqi">中国象棋</option>
                    <option value="chess">国际象棋</option>
                    <option value="go">围棋</option>
                    <option value="gomoku">五子棋</option>
                    <option value="checkers">国际跳棋</option>
                    <option value="shogi">将棋</option>
                    <option value="tetris">俄罗斯方块</option>
                </select>
            </div>
            <div class="config-row">
                <div class="config-label"><span class="dot blue"></span>黑方（上方 · 后手）</div>
                <select class="config-select" id="blueRuleset">
                    <option value="chess">国际象棋</option>
                    <option value="xiangqi">中国象棋</option>
                    <option value="go">围棋</option>
                    <option value="gomoku">五子棋</option>
                    <option value="checkers">国际跳棋</option>
                    <option value="shogi">将棋</option>
                    <option value="tetris">俄罗斯方块</option>
                </select>
            </div>
            <div class="config-row">
                <span class="config-pos">位置：红方固定在下方（先手），黑方在上方（后手）</span>
            </div>
            <div class="config-row">
                <div class="config-label">🤖 人机模式</div>
                <select class="config-select" id="aiSelect">
                    <option value="none">无</option>
                    <option value="red">红方</option>
                    <option value="blue">黑方</option>
                </select>
            </div>
            <div class="config-buttons">
                <button class="btn-start" id="startBtn">开始对局</button>
            </div>
        </div>
    </div>

    <div class="game-container">
        <div class="header">
            <div class="turn-indicator">
                <span id="turnLabel">红方走</span>
                <span class="turn-dot red" id="turnDot"></span>
            </div>
            <div id="goReserveInfo" class="go-reserve-info"></div>
            <div id="shogiHandArea" class="shogi-hand-area"></div>
            <div style="display:flex;gap:6px;flex-wrap:wrap;">
                <button class="btn-config-open" id="configBtn">⚙ 规则</button>
                <button class="btn-config-open" id="sandboxBtn">🧪 沙盒</button>
                <button class="btn-sandbox-start" id="btnSandboxStart" style="display:none;">开始对局</button>
                <button class="btn-reset" id="resetBtn">🔄 新局</button>
            </div>
        </div>
        <div class="canvas-wrapper">
            <canvas id="boardCanvas"></canvas>
        </div>
        <div class="status-bar" id="statusBar">点击棋子查看走法</div>
    </div>

    <!-- 沙盒模式 -->
    <div class="sandbox-wrapper" id="sandboxWrapper">
        <div class="sandbox-panel black-panel" id="sbBlackPanel">
            <h3>黑方棋子</h3>
            <div id="sbBlackPieces"></div>
            <div class="sb-core-config">
                <div class="config-label">黑方核心棋种</div>
                <div class="sb-config-row">
                    <select id="sbBlueRuleset">
                        <option value="chess">国际象棋</option>
                        <option value="xiangqi">中国象棋</option>
                        <option value="go">围棋</option>
                        <option value="gomoku">五子棋</option>
                        <option value="checkers">国际跳棋</option>
                        <option value="shogi">将棋</option>
                        <option value="tetris">俄罗斯方块</option>
                    </select>
                </div>
            </div>
        </div>
        <div class="sandbox-center" id="sbCenter"></div>
        <div class="sandbox-panel" id="sbRedPanel">
            <h3>红方棋子</h3>
            <div id="sbRedPieces"></div>
            <div class="sb-core-config">
                <div class="config-label">红方核心棋种</div>
                <div class="sb-config-row">
                    <select id="sbRedRuleset">
                        <option value="xiangqi">中国象棋</option>
                        <option value="chess">国际象棋</option>
                        <option value="go">围棋</option>
                        <option value="gomoku">五子棋</option>
                        <option value="checkers">国际跳棋</option>
                        <option value="shogi">将棋</option>
                    </select>
                </div>
                <div class="sandbox-status" id="sbStatus">点击左侧/右侧棋子选择，再点击棋盘放置</div>
            </div>
        </div>
    </div>

    <script>
        // ============================================================
        // 常量与配置
        // ============================================================
        const COLS = 9;
        const ROWS = 10;
        const CELL_SIZE_BASE = 56;

        // ============================================================
        // PIECE REGISTRY —— 棋子自治注册表
        // 每个棋子类型自带 ruleset、走法、显示名、AI 价值等，不再依赖全局观察
        // ============================================================
        const PIECE_REGISTRY = {};

        function definePiece(type, config) { PIECE_REGISTRY[type] = config; }

        // Board-level helpers（棋子独立计算走法时依赖的工具函数）
        function inBoard(r, c) { return r >= 0 && r < ROWS && c >= 0 && c < COLS; }
        function sideOfColor(color) { return color === 'red' ? 'bottom' : 'top'; }

        // 中国象棋九宫
        function palaceContains(color, r, c) {
            if (sideOfColor(color) === 'bottom') return r >= 7 && r <= 9 && c >= 3 && c <= 5;
            return r >= 0 && r <= 2 && c >= 3 && c <= 5;
        }
        // 中国象棋己方半场
        function ownHalf(color, r) {
            return sideOfColor(color) === 'bottom' ? r >= 5 && r <= 9 : r >= 0 && r <= 4;
        }
        // 兵的向前方向
        function forwardDir(color) { return sideOfColor(color) === 'bottom' ? -1 : +1; }
        // 中象兵是否过河
        function xqPawnCrossed(color, row) { return sideOfColor(color) === 'bottom' ? row <= 4 : row >= 5; }
        // 国象兵起始行
        function chPawnStartRow(color) { return sideOfColor(color) === 'bottom' ? 8 : 1; }
        // 国象兵升变行
        function chPawnPromoteRow(color) { return sideOfColor(color) === 'bottom' ? 0 : 9; }
        // 将棋升变区：对方后三行
        function inShogiPromoZone(color, row) {
            return sideOfColor(color) === 'bottom' ? row <= 2 : row >= 7;
        }

        // addMove / addLinear helpers（供 piece.getMoves 使用）
        function mkMove(r, c, b, color, arr) {
            if (inBoard(r, c)) {
                const t = b[r][c];
                if (!t || t.color !== color) arr.push({ row: r, col: c });
            }
        }
        function mkLinear(dr, dc, row, col, b, color, arr, limit = 9) {
            let r = row + dr, c = col + dc, steps = 0;
            while (inBoard(r, c) && steps < limit) {
                const t = b[r][c];
                if (t) {
                    if (t.color !== color) arr.push({ row: r, col: c });
                    break;
                }
                arr.push({ row: r, col: c });
                r += dr; c += dc; steps++;
            }
        }

        // ============================================================
        // 中国象棋棋子定义
        // ============================================================
        definePiece('xiangqi-king', {
            ruleset: 'xiangqi', category: 'moving', value: 10000,
            getMoves(board, row, col, piece) {
                const m = [];
                for (const [dr, dc] of [[-1,0],[1,0],[0,-1],[0,1]]) {
                    const nr = row + dr, nc = col + dc;
                    if (palaceContains(piece.color, nr, nc)) mkMove(nr, nc, board, piece.color, m);
                }
                return m;
            },
            getDisplayName(color) { return color === 'red' ? '帅' : '將'; }
        });
        definePiece('advisor', {
            ruleset: 'xiangqi', category: 'moving', value: 200,
            getMoves(board, row, col, piece) {
                const m = [];
                for (const [dr, dc] of [[-1,-1],[-1,1],[1,-1],[1,1]]) {
                    const nr = row + dr, nc = col + dc;
                    if (palaceContains(piece.color, nr, nc)) mkMove(nr, nc, board, piece.color, m);
                }
                return m;
            },
            getDisplayName(color) { return color === 'red' ? '仕' : '士'; }
        });
        definePiece('elephant', {
            ruleset: 'xiangqi', category: 'moving', value: 330,
            getMoves(board, row, col, piece) {
                const m = [];
                for (const [dr, dc] of [[-2,-2],[-2,2],[2,-2],[2,2]]) {
                    const nr = row + dr, nc = col + dc;
                    const mr = row + dr/2, mc = col + dc/2;
                    if (inBoard(nr, nc) && ownHalf(piece.color, nr) && !board[mr][mc])
                        mkMove(nr, nc, board, piece.color, m);
                }
                return m;
            },
            getDisplayName(color) { return color === 'red' ? '相' : '象'; }
        });
        definePiece('horse', {
            ruleset: 'xiangqi', category: 'moving', value: 320,
            getMoves(board, row, col, piece) {
                const m = [];
                const jumps = [[-2,-1,-1,0],[-2,1,-1,0],[2,-1,1,0],[2,1,1,0],[-1,-2,0,-1],[1,-2,0,-1],[-1,2,0,1],[1,2,0,1]];
                for (const [dr, dc, br, bc] of jumps) {
                    const nr = row + dr, nc = col + dc;

            if (!p1 || !p2) return false;

        function isEnemy(color, piece) {
            if (!piece) return false;
            return piece.color !== color;

        function cloneBoard(b) {
            return b.map(row => row.map(cell => cell ? { ...cell } : null));

        function findKing(b, color) {
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    const p = b[r][c];
                    if (p && p.color === color && (p.type === 'xiangqi-king' || p.type === 'chess-king' || p.type === 'shogi-king')) {
                        return { row: r, col: c };
                    }
                }
            }
            return null;
        }

            let n = 0;
            for (let r = 0; r < ROWS; r++)

        // ============================================================
        // 棋种自治输赢判断（每个棋种只判自己，不判对方）
        // ============================================================
        const RULESETS = {
            xiangqi: {
                name: '中国象棋',
                checkDefeat(b, color) {
                    if (!findKing(b, color)) return '主帅被围死';
                    for (let r = 0; r < ROWS; r++)
                        for (let c = 0; c < COLS; c++)
                            if (b[r][c] && b[r][c].color === color && getLegalMoves(b, r, c).length > 0) return null;
                    return '将死/困毙';
                },
                checkVictory() { return null; }
            },
            chess: {
                name: '国际象棋',
                checkDefeat(b, color) {
                    if (!findKing(b, color)) return '国王被围死';
                    for (let r = 0; r < ROWS; r++)
                        for (let c = 0; c < COLS; c++)
                            if (b[r][c] && b[r][c].color === color && getLegalMoves(b, r, c).length > 0) return null;
                    return '将死/困毙';
                },
                checkVictory() { return null; }
            },
            shogi: {
                name: '将棋',
                checkDefeat(b, color) {
                    if (!findKing(b, color)) return '王将被围死';
                    for (let r = 0; r < ROWS; r++)
                        for (let c = 0; c < COLS; c++)
                            if (b[r][c] && b[r][c].color === color && getLegalMoves(b, r, c).length > 0) return null;
                    if (generateShogiDrops(b, color).length > 0) return null;
                    return '将死/困毙';
                },
                checkVictory(b, color) {
                    if (checkGomokuWin(b, color)) return '借五子之力连珠';
                    return null;
                }
            },
            go: {
                name: '围棋',
                checkDefeat(b, color) {
                    let stones = 0;
                    for (let r = 0; r < ROWS; r++)
                        for (let c = 0; c < COLS; c++)
                            if (b[r][c] && b[r][c].color === color && b[r][c].type === 'go-stone') stones++;
                    if (stones === 0 && goReserve[color] === 0) return '围棋方棋子被吃光';
                    return null;
                },
                checkVictory() { return null; }
            },
            gomoku: {
                name: '五子棋',
                checkDefeat(b, color) {
                    let stones = 0;
                    for (let r = 0; r < ROWS; r++)
                        for (let c = 0; c < COLS; c++)
                            if (b[r][c] && b[r][c].color === color && b[r][c].type === 'gomoku-stone') stones++;
                    if (stones === 0 && goReserve[color] === 0) return '五子棋方棋子耗尽';
                    return null;
                },
                checkVictory(b, color) {
                    if (checkGomokuWin(b, color)) return '连成五子';
                    return null;
                }
            },
            checkers: {
                name: '国际跳棋',
                checkDefeat(b, color) {
                    for (let r = 0; r < ROWS; r++)
                        for (let c = 0; c < COLS; c++)
                            if (b[r][c] && b[r][c].color === color && getLegalMoves(b, r, c).length > 0) return null;
                    return '跳棋方无子可走';
                },
                checkVictory() { return null; }
            },
            tetris: {
                name: '俄罗斯方块',
                checkDefeat(b, color) {
                    return tetrisDefeated ? '方块超界不可放置' : null;
                },
                checkVictory() { return null; }
            }
        };

        // ============================================================
        // 将棋：方向、升变区、手持棋子、打入
        // ============================================================
        // 将棋可升变类型（升变后走法变金将）
        const SHOGI_PROMOTABLE = ['shogi-silver', 'shogi-knight', 'shogi-lance', 'shogi-pawn'];
        // 手持棋子基础类型映射（升变子被吃后降级）
        function shogiBaseType(type) {
            if (type === 'shogi-dragon') return 'shogi-rook';
            if (type === 'shogi-horse') return 'shogi-bishop';
            return type;
        }
        // 移动后是否必须升变（步/香在最后一行，桂在最后两行）
        function mustShogiPromote(type, color, row) {
            const lastRow = sideOfColor(color) === 'bottom' ? 0 : 9;
            const last2 = sideOfColor(color) === 'bottom' ? 1 : 8;
            if (type === 'shogi-pawn' || type === 'shogi-lance') return row === lastRow;
            if (type === 'shogi-knight') return row === lastRow || row === last2;
            return false;
        }
        // 升变检查：从 from 到 to，是否可升（仅将棋类型）
        function canShogiPromote(piece, fromRow, toRow) {
            if (!piece || piece.promoted) return false;
            const def = PIECE_REGISTRY[piece.type];
            if (!def || def.ruleset !== 'shogi') return false;
            if (piece.type === 'shogi-king' || piece.type === 'shogi-gold') return false;
            return inShogiPromoZone(piece.color, fromRow) || inShogiPromoZone(piece.color, toRow);
        }
        // 自动升变（仅将棋类型）
        function autoShogiPromote(piece, toRow) {
            if (!piece || piece.promoted) return;
            const def = PIECE_REGISTRY[piece.type];
            if (!def || def.ruleset !== 'shogi') return;
            if (piece.type === 'shogi-king' || piece.type === 'shogi-gold') return;
            if (mustShogiPromote(piece.type, piece.color, toRow) || inShogiPromoZone(piece.color, toRow)) {
                piece.promoted = true;
            }
        }

        // 手持棋子操作（"混乱之棋"：捕获的棋子保留原类型和走法）
        function addToHand(color, piece) {
            const base = shogiBaseType(piece.type);
            if (!shogiHand[color][base]) shogiHand[color][base] = 0;
            shogiHand[color][base]++;
        }
        function removeFromHand(color, type) {
            if (shogiHand[color][type] && shogiHand[color][type] > 0) {
                shogiHand[color][type]--;
                if (shogiHand[color][type] === 0) delete shogiHand[color][type];
            }
        }
        // 打入合法性校验
        function canDropShogi(b, color, type, row, col) {
            if (b[row][col]) return false; // 目标非空
            // 步/香/桂不能打入到无合法走法的位置
            if (type === 'shogi-pawn' || type === 'shogi-lance') {
                if (mustShogiPromote(type, color, row)) return false;
            }
            if (type === 'shogi-knight') {
                const fwd = forwardDir(color);
                const targets = [[row + fwd * 2, col - 1], [row + fwd * 2, col + 1]];
                let hasLand = false;
                for (const [tr, tc] of targets) {
                    if (inBoard(tr, tc) && !b[tr][tc]) hasLand = true;
                    else if (inBoard(tr, tc) && b[tr][tc] && b[tr][tc].color !== color) hasLand = true;
                }
                if (!hasLand) return false;
            }
            // 二步禁手：同一列不能有两个己方未升变步兵
            if (type === 'shogi-pawn') {
                for (let r = 0; r < ROWS; r++) {
                    const p = b[r][col];
                    if (p && p.color === color && p.type === 'shogi-pawn' && !p.promoted) return false;
                }
            }
            return true;
        }
        // 生成某颜色的所有合法打入位置（含王安全校验）
        function generateShogiDrops(b, color) {
            const drops = [];
            const hasKing = findKing(b, color) !== null;
            for (const type in shogiHand[color]) {
                if (shogiHand[color][type] <= 0) continue;
                for (let r = 0; r < ROWS; r++) {
                    for (let c = 0; c < COLS; c++) {
                        if (!canDropShogi(b, color, type, r, c)) continue;
                        if (hasKing) {
                            const sim = cloneBoard(b);
                            const isST = getPieceRuleset(type) === 'shogi';
                            sim[r][c] = { color, type, promoted: isST && inShogiPromoZone(color, r) && type !== 'shogi-king' && type !== 'shogi-gold' };
                            if (!isKingSafe(sim, color)) continue;
                        }
                        drops.push({ row: r, col: c, dropType: type });
                    }
                }
            }
            return drops;
        }

        // 王安全校验（检查color方的王是否受攻）
        function isKingSafe(b, color) {
            const king = findKing(b, color);
            if (!king) return false;
            const enemy = color === 'red' ? 'blue' : 'red';
            for (let er = 0; er < ROWS; er++) {
                for (let ec = 0; ec < COLS; ec++) {
                    const ep = b[er][ec];
                    if (!ep || ep.color !== enemy) continue;
                    const raw = generateRawMoves(b, er, ec);
                    if (raw.some(m => m.row === king.row && m.col === king.col)) return false;
                }
            }
            return true;
        }

        // ============================================================
        // 围棋：气与提子算法（所有棋子都有气，无气即被提走）
        // ============================================================
        const DIRS4 = [[-1, 0], [1, 0], [0, -1], [0, 1]];

        // 找出 (row,col) 所在同色连通块的所有棋子坐标
        function findGroup(b, row, col) {
            const piece = b[row][col];
            if (!piece) return [];
            const color = piece.color;
            const visited = new Set();
            const group = [];
            const stack = [[row, col]];
            while (stack.length) {
                const [r, c] = stack.pop();
                const key = r + ',' + c;
                if (visited.has(key)) continue;
                visited.add(key);
                const p = b[r][c];
                if (!p || p.color !== color) continue;
                group.push([r, c]);
                for (const [dr, dc] of DIRS4) {
                    const nr = r + dr, nc = c + dc;
                    if (inBoard(nr, nc) && !visited.has(nr + ',' + nc)) {
                        stack.push([nr, nc]);
                    }
                }
            }
            return group;
        }

        // 计算一组棋子的气数（相邻空交叉点数量）
        function countLiberties(b, group) {
            const libs = new Set();
            for (const [r, c] of group) {
                for (const [dr, dc] of DIRS4) {
                    const nr = r + dr, nc = c + dc;
                    if (inBoard(nr, nc) && !b[nr][nc]) libs.add(nr + ',' + nc);
                }
            }
            return libs.size;
        }

        // 落子/移动后检查提子：只对围棋/五子棋棋子生效，且仅围棋方参与时才触发
        // 返回被提走的棋子列表 [{row,col,piece}]
        function resolveCaptures(b, lastColor) {
            const enemyColor = lastColor === 'red' ? 'blue' : 'red';
            // 气/提子机制仅在围棋方参与时生效
            if (!isGo(lastColor) && !isGo(enemyColor)) return [];
            const captured = [];
            const removeGroup = (color) => {
                const checked = new Set();
                for (let r = 0; r < ROWS; r++) {
                    for (let c = 0; c < COLS; c++) {
                        const key = r + ',' + c;
                        if (checked.has(key)) continue;
                        const p = b[r][c];
                        if (p && p.color === color) {
                            // 仅围棋/五子棋棋子以及各方主帅参与气-提子判定
                            const canCapture = p.type === 'go-stone' || p.type === 'gomoku-stone'
                                || p.type === 'xiangqi-king' || p.type === 'chess-king' || p.type === 'shogi-king';
                            if (!canCapture) continue;
                            const grp = findGroup(b, r, c);
                            for (const [gr, gc] of grp) checked.add(gr + ',' + gc);
                            if (countLiberties(b, grp) === 0) {
                                for (const [gr, gc] of grp) {
                                    captured.push({ row: gr, col: gc, piece: b[gr][gc] });
                                    b[gr][gc] = null;
                                }
                            }
                        }
                    }
                }
            };
            removeGroup(enemyColor); // 先提对方
            removeGroup(lastColor);  // 再提己方（自杀）
            return captured;
        }

        // 围棋方落子是否为自杀禁手（试落→检查己方是否有气或是否吃到对方）
        function isGoSuicide(b, row, col, color) {
            b[row][col] = { color, type: 'go-stone' };
            const grp = findGroup(b, row, col);
            const hasLib = countLiberties(b, grp) > 0;
            // 是否吃到对方
            const enemy = color === 'red' ? 'blue' : 'red';
            let captured = false;
            for (const [dr, dc] of DIRS4) {
                const nr = row + dr, nc = col + dc;
                if (inBoard(nr, nc) && b[nr][nc] && b[nr][nc].color === enemy) {
                    const eg = findGroup(b, nr, nc);
                    if (countLiberties(b, eg) === 0) { captured = true; break; }
                }
            }
            b[row][col] = null; // 撤销试落
            return !hasLib && !captured;
        }

        // ============================================================
        // 走法生成（核心）—— 委托给注册表，棋子自治
        // ============================================================
        function generateRawMoves(b, row, col) {
            return getPieceMoves(b, row, col);
        }

        // 检查当前局面 color 方的王是否被将军
        function isKingInCheck(b, color) {
            const king = findKing(b, color);
            if (!king) return false;
            const enemy = color === 'red' ? 'blue' : 'red';
            for (let er = 0; er < ROWS; er++) {
                for (let ec = 0; ec < COLS; ec++) {
                    const ep = b[er][ec];
                    if (!ep || ep.color !== enemy) continue;
                    const raw = generateRawMoves(b, er, ec);
                    if (raw.some(m => m.row === king.row && m.col === king.col)) return true;
                }
            }
            return false;
        }

        // 检查走一步后，己方王是否会被吃（合法性检查）
        function isMoveLegal(b, fromRow, fromCol, toRow, toCol, color) {
            // 无王规则体系（跳棋方自身、围棋、五子棋）不检查王安全
            if (isGo(color) || isGomoku(color) || isCheckers(color)) return true;

            // 模拟走子
            const testBoard = cloneBoard(b);
            testBoard[toRow][toCol] = testBoard[fromRow][fromCol];
            testBoard[fromRow][fromCol] = null;

            // 处理跳棋跳跃吃子：移除被跳过的棋子
            const moved = testBoard[toRow][toCol];
            if (moved && (moved.type === 'checker-man' || moved.type === 'checker-king')) {
                const dr = toRow - fromRow, dc = toCol - fromCol;
                if (Math.abs(dr) >= 2 && Math.abs(dc) >= 2) {
                    testBoard[toRow - Math.sign(dr)][toCol - Math.sign(dc)] = null;
                }
            }

            // 检查己方王是否被吃
            const king = findKing(testBoard, color);
            if (!king) return false; // 王被吃，非法

            // 检查所有对方棋子是否能吃掉己方王
            const enemy = color === 'red' ? 'blue' : 'red';
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    const p = testBoard[r][c];
                    if (p && p.color === enemy) {
                        const attacks = generateRawMoves(testBoard, r, c);
                        for (const atk of attacks) {
                            if (atk.row === king.row && atk.col === king.col) {
                                return false; // 王被将军，非法
                            }
                        }
                    }
                }
            }

            // 额外：中国象棋的帅不能照面（将帅对面）
            // 检查红帅和蓝王是否在同一列且中间无棋子
            const redKing = findKing(testBoard, 'red');
            const blueKing = findKing(testBoard, 'blue');
            if (redKing && blueKing && redKing.col === blueKing.col) {
                const c = redKing.col;
                const rMin = Math.min(redKing.row, blueKing.row);
                const rMax = Math.max(redKing.row, blueKing.row);
                let blocked = false;
                for (let r = rMin + 1; r < rMax; r++) {
                    if (testBoard[r][c]) { blocked = true; break; }
                }
                if (!blocked) return false;
            }

            return true;
        }

        // 获取某个棋子的所有合法走法
        function getLegalMoves(b, row, col) {
            const piece = b[row][col];
            if (!piece) return [];
            const raw = generateRawMoves(b, row, col);
            const legal = [];
            for (const m of raw) {
                if (isMoveLegal(b, row, col, m.row, m.col, piece.color)) {
                    legal.push(m);
                }
            }
            return legal;
        }

        // 检查五子棋方是否连成五子（横/竖/正斜/反斜）
        function checkGomokuWin(b, color) {
            const dirs = [
                [0, 1],   // 横
                [1, 0],   // 竖
                [1, 1],   // 正斜
                [1, -1]   // 反斜
            ];
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    const p = b[r][c];
                    if (!p || p.color !== color || p.type !== 'gomoku-stone') continue;
                    for (const [dr, dc] of dirs) {
                        let count = 1;
                        for (let i = 1; i < 5; i++) {
                            const nr = r + dr * i, nc = c + dc * i;
                            if (!inBoard(nr, nc)) break;
                            const np = b[nr][nc];
                            if (!np || np.color !== color || np.type !== 'gomoku-stone') break;
                            count++;
                        }
                        if (count >= 5) return true;
                    }
                }
            }
            return false;
        }

        // 检查围棋方是否还有合法落子位置（非自杀）
        function hasValidGoPlacement(b, color) {
            if (goReserve[color] <= 0) return false;
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    if (!b[r][c] && !isGoSuicide(b, r, c, color)) return true;
                }
            }
            return false;
        }

        // 跳棋方是否有任何棋子可以跳吃
        function checkersHasAnyJump(b, color) {
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    const p = b[r][c];
                    if (p && p.color === color && isCheckers(color)) {
                        const raw = generateRawMoves(b, r, c);
                        if (raw.some(m => m.isJump)) return true;
                    }
                }
            }
            return false;
        }

        // 跳棋方是否有任何棋子可以走（跳吃或普通）
        function checkersHasAnyMove(b, color) {
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    const p = b[r][c];
                    if (p && p.color === color && isCheckers(color)) {
                        const moves = getLegalMoves(b, r, c);
                        if (moves.length > 0) return true;
                    }
                }
            }
            return false;
        }

        // ============================================================
        // 俄罗斯方块系统（仅黑方可选）
        // ============================================================
        // 七种标准方块形状（SRS 相对坐标）
        const TETROMINO_SHAPES = {
            I: { cells: [[0,0],[0,1],[0,2],[0,3]] },
            O: { cells: [[0,0],[0,1],[1,0],[1,1]] },
            T: { cells: [[0,0],[0,1],[0,2],[1,1]] },
            S: { cells: [[0,1],[0,2],[1,0],[1,1]] },
            Z: { cells: [[0,0],[0,1],[1,1],[1,2]] },
            J: { cells: [[0,0],[1,0],[1,1],[1,2]] },
            L: { cells: [[0,2],[1,0],[1,1],[1,2]] }
        };
        const TETROMINO_KEYS = ['I','O','T','S','Z','J','L'];
        const TETRIS_COLORS = ['#00e5ff', '#ffea00', '#d500f9', '#76ff03', '#ff9100', '#2979ff', '#00c853'];
        const TETRIS_FALL_INTERVAL = 500; // ms，自动下落间隔
        const TETRIS_SPEED_INTERVAL = 50;  // ms，加速下落间隔

        // 俄罗斯方块状态
        let tetrisState = {
            active: false,        // 是否正在下落
            pieceType: null,      // 'I'|'O'|... 当前方块类型
            cells: [],            // 当前方块各格在棋盘上的绝对坐标 [[r,c],...]
            color: '#00e5ff',     // 当前方块颜色
            fallTimer: null,      // 下落计时器ID
            defeated: false       // 是否已失败（方块超界）
        };
        let tetrisDefeated = false; // 暴露给 RULESETS.tetris.checkDefeat

        // 获取方块在指定位置的绝对坐标
        function tetrisAbsCells(shapeKey, row, col) {
            return TETROMINO_SHAPES[shapeKey].cells.map(([r,c]) => [row + r, col + c]);
        }

        // 检查方块指定位置是否碰撞
        function tetrisCollides(cells) {
            for (const [r, c] of cells) {
                if (r < 0 || r >= ROWS || c < 0 || c >= COLS) return true;
                if (board[r][c]) return true;
            }
            return false;
        }

        // 尝试旋转（以当前方块中心为轴，含墙踢）
        function tetrisTryRotate() {
            const shapeKey = tetrisState.pieceType;
            if (!shapeKey || shapeKey === 'O') return;
            const cells = tetrisState.cells;
            // 计算当前四格方块的中心
            let sumR = 0, sumC = 0;
            for (const [r, c] of cells) { sumR += r; sumC += c; }
            const cr = Math.round(sumR / cells.length);
            const cc = Math.round(sumC / cells.length);
            // 每格绕中心顺时针旋转90°: (r,c) → (cr + (c-cc), cc - (r-cr))
            const rotated = cells.map(([r, c]) => [cr + (c - cc), cc - (r - cr)]);
            // 墙踢
            const kicks = [[0,0], [-1,0], [1,0], [0,-1], [0,1], [-2,0], [2,0]];
            for (const [dr, dc] of kicks) {
                const kicked = rotated.map(([r, c]) => [r + dr, c + dc]);
                if (!tetrisCollides(kicked)) {
                    tetrisState.cells = kicked;
                    return;
                }
            }
        }

        // 尝试左移
        function tetrisMoveLeft() {
            const moved = tetrisState.cells.map(([r,c]) => [r, c - 1]);
            if (!tetrisCollides(moved)) tetrisState.cells = moved;
        }

        // 尝试右移
        function tetrisMoveRight() {
            const moved = tetrisState.cells.map(([r,c]) => [r, c + 1]);
            if (!tetrisCollides(moved)) tetrisState.cells = moved;
        }

        // 尝试下移（返回false=锁定）
        function tetrisMoveDown() {
            const moved = tetrisState.cells.map(([r,c]) => [r + 1, c]);
            if (tetrisCollides(moved)) {
                tetrisLock();
                return false;
            }
            tetrisState.cells = moved;
            return true;
        }

        // 硬降到底
        function tetrisHardDrop() {
            while (true) {
                const moved = tetrisState.cells.map(([r,c]) => [r + 1, c]);
                if (tetrisCollides(moved)) break;
                tetrisState.cells = moved;
            }
            tetrisLock();
        }

        // 锁定方块：变为棋盘上独立tetris-block棋子
        function tetrisLock() {
            for (const [r, c] of tetrisState.cells) {
                board[r][c] = { color: 'blue', type: 'tetris-block', blockColor: tetrisState.color };
            }
            // 消行
            tetrisClearLines();
            // 清理状态
            tetrisStopFall();
            tetrisState.active = false;
            tetrisState.cells = [];
            drawBoard();
            // 切换到红方
            const over = switchTurn();
            if (!over) {
                drawBoard();
                statusBar.textContent = `${currentTurn === 'red' ? '红方' : '黑方'} 走棋`;
            }
        }

        // 消行：整行全满即清，上方所有棋子下移
        function tetrisClearLines() {
            let r = ROWS - 1;
            while (r >= 0) {
                let full = true;
                for (let c = 0; c < COLS; c++) {
                    if (!board[r][c]) { full = false; break; }
                }
                if (full) {
                    // 必须至少包含一个 tetris-block 才能触发消行
                    let hasTetris = false;
                    for (let c = 0; c < COLS; c++) {
                        if (board[r][c] && board[r][c].type === 'tetris-block') { hasTetris = true; break; }
                    }
                    if (!hasTetris) { r--; continue; }
                    for (let rr = r; rr > 0; rr--)
                        for (let c = 0; c < COLS; c++)
                            board[rr][c] = board[rr - 1][c];
                    for (let c = 0; c < COLS; c++) board[0][c] = null;
                    // r不变，新掉下来的行需要再检查
                } else {
                    r--;
                }
            }
        }

        // 停止下落计时器
        function tetrisStopFall() {
            if (tetrisState.fallTimer) {
                clearInterval(tetrisState.fallTimer);
                tetrisState.fallTimer = null;
            }
        }

        // 生成随机方块并开始下落
        function tetrisStartTurn() {
            tetrisState.active = true;
            tetrisDefeated = false;
            const shapeKey = TETROMINO_KEYS[Math.floor(Math.random() * TETROMINO_KEYS.length)];
            tetrisState.pieceType = shapeKey;
            // 在顶部中间生成
            const spawnCol = Math.floor((COLS - 1) / 2);
            tetrisState.cells = tetrisAbsCells(shapeKey, 0, spawnCol);
            tetrisState.color = TETRIS_COLORS[Math.floor(Math.random() * TETRIS_COLORS.length)];

            // 检查出生即碰撞 → 失败
            if (tetrisCollides(tetrisState.cells)) {
                tetrisState.cells = [];
                tetrisState.active = false;
                tetrisDefeated = true;
                const winColor = currentTurn === 'red' ? 'blue' : 'red'; // 虽然说是黑方输，但实际是 currentTurn = blue
                // currentTurn 还未切换，黑方刚轮到自己就输了
                showVictory('red', '方块超界不可放置');
                return;
            }

            statusBar.textContent = '黑方（俄罗斯方块）放置方块 · 点击四象限或键盘控制';
            drawBoard();
            // 启动下落
            tetrisState.fallTimer = setInterval(() => {
                if (!tetrisState.active) { tetrisStopFall(); return; }
                tetrisMoveDown();
                if (tetrisState.active) drawBoard();
            }, TETRIS_FALL_INTERVAL);
        }

        // 加速下落（S/下键触发的快速下落）
        function tetrisSoftDrop() {
            if (!tetrisState.active) return;
            tetrisMoveDown();
            if (tetrisState.active) drawBoard();
        }

        // 四象限点击操控
        function handleTetrisQuadrant(quadrant) {
            if (!tetrisState.active) return;
            switch (quadrant) {
                case 'top': tetrisTryRotate(); break;
                case 'bottom': tetrisHardDrop(); break;
                case 'left': tetrisMoveLeft(); break;
                case 'right': tetrisMoveRight(); break;
            }
            if (tetrisState.active) drawBoard();
        }

        // 键盘操控
        function handleTetrisKey(key) {
            if (!tetrisState.active) return;
            switch (key) {
                case 'ArrowUp': case 'w': case 'W': tetrisTryRotate(); break;
                case 'ArrowDown': case 's': case 'S': tetrisSoftDrop(); break;
                case 'ArrowLeft': case 'a': case 'A': tetrisMoveLeft(); break;
                case 'ArrowRight': case 'd': case 'D': tetrisMoveRight(); break;
                case ' ': tetrisHardDrop(); break; // 空格硬降
            }
            if (tetrisState.active) drawBoard();
        }

        // ============================================================
        // 游戏逻辑
        // ============================================================

        function switchTurn() {
            currentTurn = currentTurn === 'red' ? 'blue' : 'red';
            selectedHandPiece = null; // 清将棋手持选中
            updateTurnUI();

            // ===== 俄罗斯方块回合：直接进入下落，不走自治输赢 =====
            if (isTetris(currentTurn)) {
                tetrisStartTurn();
                return false;
            }

            // ===== 自治输赢：刚走棋方判赢 + 当前方判输 =====
            const prevColor = currentTurn === 'red' ? 'blue' : 'red';
            const prevRS = RULESETS[getRuleset(prevColor)];
            const curRS = RULESETS[getRuleset(currentTurn)];

            // 1. 刚走子的棋种是否有主动胜利条件？（仅五子棋）
            const vicReason = prevRS.checkVictory(board, prevColor);
            if (vicReason) {
                showVictory(prevColor, vicReason);
                return true;
            }

            // 2. 当前棋种是否已经败北？
            const defReason = curRS.checkDefeat(board, currentTurn);
            if (defReason) {
                const winColor = currentTurn === 'red' ? 'blue' : 'red';
                showVictory(winColor, defReason);
                return true;
            }

            // 围棋方自动pass：储备空或无合法落子位置
            if (isGo(currentTurn)) {
                if (goReserve[currentTurn] <= 0 || !hasValidGoPlacement(board, currentTurn)) {
                    statusBar.textContent = `${currentTurn === 'red' ? '红方' : '黑方'}（围棋）无子可下，跳过`;
                    return switchTurn(); // 递归切换给对方
                }
                statusBar.textContent = `${currentTurn === 'red' ? '红方' : '黑方'}（围棋）落子 · 剩余${goReserve[currentTurn]}颗`;
                triggerAI();
                return false;
            }

            // 五子棋方自动pass：储备空
            if (isGomoku(currentTurn)) {
                if (goReserve[currentTurn] <= 0) {
                    statusBar.textContent = `${currentTurn === 'red' ? '红方' : '黑方'}（五子棋）储备已空，跳过`;
                    return switchTurn();
                }
                statusBar.textContent = `${currentTurn === 'red' ? '红方' : '黑方'}（五子棋）落子 · 剩余${goReserve[currentTurn]}颗`;
                triggerAI();
                return false;
            }

            // 将棋方：更新手持显示 + 触AI
            if (isShogi(currentTurn)) {
                const inCheck = isKingInCheck(board, currentTurn);
                if (inCheck) {
                    statusBar.textContent = `${currentTurn === 'red' ? '红方' : '黑方'}（将棋）将军！走棋或打入`;
                } else {
                    statusBar.textContent = `${currentTurn === 'red' ? '红方' : '黑方'}（将棋）走棋或打入`;
                }
                triggerAI();
                return false;
            }

            // 跳棋方自动pass：无合法走法（被堵死）
            if (isCheckers(currentTurn)) {
                if (!checkersHasAnyMove(board, currentTurn)) {
                    statusBar.textContent = `${currentTurn === 'red' ? '红方' : '黑方'}（跳棋）无合法走法，跳过`;
                    return switchTurn();
                }
                const hasJump = checkersHasAnyJump(board, currentTurn);
                statusBar.textContent = `${currentTurn === 'red' ? '红方' : '黑方'}（跳棋）${hasJump ? '必须跳吃' : '走棋'}`;
                triggerAI();
                return false;
            }

            // 象棋方：检查是否被将军（提示）
            const king = findKing(board, currentTurn);
            if (king) {
                const enemy = currentTurn === 'red' ? 'blue' : 'red';
                let inCheck = false;
                for (let r = 0; r < ROWS; r++) {
                    for (let c = 0; c < COLS; c++) {
                        const p = board[r][c];
                        if (p && p.color === enemy) {
                            const moves = generateRawMoves(board, r, c);
                            for (const m of moves) {
                                if (m.row === king.row && m.col === king.col) {
                                    inCheck = true;
                                    break;
                                }
                            }
                        }
                        if (inCheck) break;
                    }
                    if (inCheck) break;
                }
                if (inCheck) {
                    statusBar.innerHTML = `⚠️ <span class="highlight">${currentTurn === 'red' ? '红方' : '黑方'}</span> 被将军！`;
                } else {
                    statusBar.textContent = `${currentTurn === 'red' ? '红方' : '黑方'} 走棋`;
                }
            }
            triggerAI();
            return false;
        }

        // 跳棋选择棋子（处理强制跳吃逻辑）
        function selectCheckersPiece(row, col, piece, hasJump) {
            const rawMoves = generateRawMoves(board, row, col);
            if (hasJump) {
                // 有跳吃时只能跳
                const jumps = rawMoves.filter(m => m.isJump);
                if (jumps.length === 0) {
                    statusBar.textContent = '必须跳吃！该棋子无法跳吃';
                    return;
                }
                validMoves = jumps;
            } else {
                validMoves = rawMoves;
            }
            selectedPos = { row, col };
            midJumpPos = null;
            drawBoard();
            const typeName = piece.type === 'checker-king' ? '王' : '兵';
            statusBar.textContent = `已选择 ${currentTurn === 'red' ? '红' : '黑'}${typeName}，点击高亮位置${hasJump ? '跳吃' : '移动'}`;
        }

        // 跳棋执行跳吃/移动（含升变、连跳检测）
        function executeCheckersJump(fromRow, fromCol, toRow, toCol) {
            const piece = board[fromRow][fromCol];
            if (!piece) return;

            // 判断是否跳吃：斜走>1格即跳吃
            const rowDiff = Math.abs(toRow - fromRow);
            const isJump = rowDiff > 1;

            // 执行移动
            board[toRow][toCol] = piece;
            board[fromRow][fromCol] = null;

            // 如果是跳吃，移除被跳过的中间棋子
            if (isJump) {
                const dr = (toRow - fromRow) / rowDiff; // 每步方向
                const dc = (toCol - fromCol) / rowDiff;
                // 被跳过的敌子（在from和to之间最近的一个敌子）
                let mr = fromRow + dr, mc = fromCol + dc;
                let jumpedPiece = null;
                for (let step = 1; step < rowDiff; step++) {
                    if (board[mr] && board[mr][mc] && board[mr][mc].color !== piece.color) {
                        jumpedPiece = board[mr][mc];
                        board[mr][mc] = null;
                        break;
                    }
                    mr += dr;
                    mc += dc;
                }
            }

            // 升变：兵到底线
            if (piece.type === 'checker-man') {
                const promoteRow = piece.color === 'red' ? 0 : 9;
                if (toRow === promoteRow) {
                    board[toRow][toCol] = { color: piece.color, type: 'checker-king' };
                }
            }

            selectedPos = null;
            validMoves = [];
            drawBoard();

            // 跳吃后检查能否继续跳（连跳）
            if (isJump) {
                const contMoves = generateRawMoves(board, toRow, toCol).filter(m => m.isJump);
                if (contMoves.length > 0) {
                    // 必须继续跳
                    midJumpPos = { row: toRow, col: toCol };
                    validMoves = contMoves;
                    drawBoard();
                    const typeName = board[toRow][toCol].type === 'checker-king' ? '王' : '兵';
                    statusBar.textContent = `连跳！${currentTurn === 'red' ? '红' : '黑'}${typeName}继续跳吃`;
                    return;
                }
            }

            midJumpPos = null;
            // 触发提子
            const caps = resolveCaptures(board, piece.color);

            const over = switchTurn();
            if (!over) {
                drawBoard();
                if (statusBar.textContent.indexOf('获胜') === -1) {
                    statusBar.textContent = `${currentTurn === 'red' ? '红方' : '黑方'} 走棋`;
                }
            }
            drawBoard();
        }

        function makeMove(fromRow, fromCol, toRow, toCol) {
            const piece = board[fromRow][fromCol];
            if (!piece) return false;
            const captured = board[toRow][toCol];
            // 记录历史
            moveHistory.push({
                from: { row: fromRow, col: fromCol },
                to: { row: toRow, col: toCol },
                piece: { ...piece },
                captured: captured ? { ...captured } : null
            });
            // 执行移动
            board[toRow][toCol] = piece;
            board[fromRow][fromCol] = null;

            // 处理跳棋跳跃吃子：移除被跳过的棋子
            let jumpedPiece = null;
            if (piece.type === 'checker-man' || piece.type === 'checker-king') {
                const dr = toRow - fromRow, dc = toCol - fromCol;
                if (Math.abs(dr) >= 2 && Math.abs(dc) >= 2) {
                    const jr = toRow - Math.sign(dr);
                    const jc = toCol - Math.sign(dc);
                    jumpedPiece = board[jr][jc];
                    board[jr][jc] = null;
                    moveHistory[moveHistory.length - 1].jumped = jumpedPiece ? { row: jr, col: jc, piece: { ...jumpedPiece } } : null;
                }
            }

            // 将棋吃子进手持（常规吃子 + 跳跃吃子）
            if (isShogi(piece.color) && captured) {
                addToHand(piece.color, captured);
            }
            if (isShogi(piece.color) && jumpedPiece) {
                addToHand(piece.color, jumpedPiece);
            }
            // 将棋自动升变
            if (isShogi(piece.color)) {
                autoShogiPromote(board[toRow][toCol], toRow);
            }

            // 国际象棋兵升变（读棋子自身 ruleset，不依赖操控方规则体系）
            const def = PIECE_REGISTRY[piece.type];
            if (def && def.promoteCheck && def.promoteCheck(board, toRow, toCol, piece)) {
                board[toRow][toCol] = { color: piece.color, type: def.getPromoteType() || 'queen' };
                const cn = piece.color === 'red' ? '红方' : '黑方';
                statusBar.textContent = `${cn}兵升变为后！`;
            }

            // 触发提子（移动可能堵死某组棋子的气）
            const caps = resolveCaptures(board, piece.color);
            for (const cap of caps) {
                if (cap.piece.type === 'go-stone') goCaptured[cap.piece.color]++;
                if (cap.piece.type === 'gomoku-stone') goCaptured[cap.piece.color]++;
            }

            selectedPos = null;
            validMoves = [];
            drawBoard();

            // 切换回合
            const over = switchTurn();
            if (!over) {
                drawBoard();
                if (statusBar.textContent.indexOf('将军') === -1 && statusBar.textContent.indexOf('获胜') === -1) {
                    statusBar.textContent = `${currentTurn === 'red' ? '红方' : '黑方'} 走棋`;
                }
            }
            drawBoard();
            return true;
        }

        // 五子棋方落子
        function placeGomokuStone(row, col) {
            const color = currentTurn;
            board[row][col] = { color, type: 'gomoku-stone' };
            goReserve[color]--;

            // 触发提子（仅在围棋方参与时生效，resolveCaptures 内部处理）
            const caps = resolveCaptures(board, color);
            for (const cap of caps) {
                if (cap.piece.type === 'go-stone') goCaptured[cap.piece.color]++;
                if (cap.piece.type === 'gomoku-stone') goCaptured[cap.piece.color]++;
            }

            const cn = color === 'red' ? '红方' : '黑方';
            const reserveInfo = `（剩余${goReserve[color]}颗）`;
            if (caps.length > 0) {
                statusBar.textContent = `${cn}（五子棋）落子${reserveInfo}，提走${caps.length}颗棋子`;
            } else {
                statusBar.textContent = `${cn}（五子棋）落子${reserveInfo}`;
            }

            selectedPos = null;
            validMoves = [];
            drawBoard();

            // 储备用完时立即检查：连五则胜，否则败
            if (goReserve[color] <= 0) {
                const victoryReason = RULESETS.gomoku.checkVictory(board, color);
                if (victoryReason) {
                    showVictory(color, victoryReason);
                    return;
                }
                const defeatReason = RULESETS.gomoku.checkDefeat(board, color);
                if (defeatReason) {
                    const winColor = color === 'red' ? 'blue' : 'red';
                    showVictory(winColor, defeatReason);
                    return;
                }
            }

            const over = switchTurn();
            if (!over) {
                drawBoard();
                if (statusBar.textContent.indexOf('将军') === -1 && statusBar.textContent.indexOf('获胜') === -1) {
                    statusBar.textContent = `${currentTurn === 'red' ? '红方' : '黑方'} 走棋`;
                }
            }
            drawBoard();
        }

        // 围棋方落子
        function placeGoStone(row, col) {
            const color = currentTurn;
            board[row][col] = { color, type: 'go-stone' };
            goReserve[color]--;

            // 触发提子
            const caps = resolveCaptures(board, color);
            for (const cap of caps) {
                if (cap.piece.type === 'go-stone') goCaptured[cap.piece.color]++;
            }

            const cn = color === 'red' ? '红方' : '黑方';
            const reserveInfo = `（剩余${goReserve[color]}颗）`;
            if (caps.length > 0) {
                statusBar.textContent = `${cn}落子${reserveInfo}，提走${caps.length}颗棋子`;
            } else {
                statusBar.textContent = `${cn}落子${reserveInfo}`;
            }

            selectedPos = null;
            validMoves = [];
            drawBoard();

            const over = switchTurn();
            if (!over) {
                drawBoard();
                if (statusBar.textContent.indexOf('将军') === -1 && statusBar.textContent.indexOf('获胜') === -1) {
                    statusBar.textContent = `${currentTurn === 'red' ? '红方' : '黑方'} 走棋`;
                }
            }
            drawBoard();
        }

        // 统一胜利显示
        function showVictory(winnerColor, reason) {
            gameOver = true;
            winner = winnerColor;
            victoryReason = reason;
            const colorName = winnerColor === 'red' ? '红方' : '黑方';
            const ruleset = rulesetName(winnerColor);
            statusBar.textContent = `${colorName}（${ruleset}）获胜 —— ${reason}`;
            statusBar.classList.add('victory');
            drawBoard();
        }

        function resetGame() {
            board = createInitialBoard();
            currentTurn = 'red'; // 红方永远先手
            selectedPos = null;
            validMoves = [];
            moveHistory = [];
            midJumpPos = null;
            gameOver = false;
            winner = null;
            victoryReason = '';
            selectedHandPiece = null;
            statusBar.classList.remove('victory');
            // 重置俄罗斯方块状态
            tetrisStopFall();
            tetrisState.active = false;
            tetrisState.cells = [];
            tetrisState.pieceType = null;
            tetrisDefeated = false;
            updateTurnUI();
            const first = `红方（${rulesetName('red')}）`;
            const second = `黑方（${rulesetName('blue')}）`;
            statusBar.textContent = `新局！${first}先手 vs ${second}后手 · 点击棋子查看走法`;
            drawBoard();
            // 如果红方是 AI，自动走第一步
            if (aiPlayer === 'red') triggerAI();
        }

        // ============================================================
        // 沙盒模式
        // ============================================================

        // 所有棋种的所有棋子类型，按规则体系分组
        const ALL_PIECE_TYPES = {
            xiangqi: ['xiangqi-king', 'advisor', 'elephant', 'horse', 'xiangqi-rook', 'cannon', 'xiangqi-pawn'],
            chess: ['chess-king', 'queen', 'bishop', 'knight', 'chess-rook', 'chess-pawn'],
            shogi: ['shogi-king', 'shogi-gold', 'shogi-silver', 'shogi-knight', 'shogi-lance', 'shogi-pawn', 'shogi-rook', 'shogi-bishop'],
            go: ['go-stone'],
            gomoku: ['gomoku-stone'],
            checkers: ['checker-man', 'checker-king'],
            tetris: ['tetris-block']
        };

        function buildSandboxPanel(containerId, color) {
            const container = document.getElementById(containerId);
            if (!container) return;
            let html = '';
            for (const [ruleset, types] of Object.entries(ALL_PIECE_TYPES)) {
                const rsName = RULESETS[ruleset] ? RULESETS[ruleset].name : ruleset;
                html += `<div class="sb-ruleset-group"><div class="sb-ruleset-label">${rsName}</div><div class="sb-piece-grid">`;
                for (const type of types) {
                    const displayName = getPieceDisplayName(type, color);
                    html += `<button class="sb-piece-btn ${color === 'red' ? 'red-piece' : 'blue-piece'}" data-type="${type}" data-color="${color}" title="${displayName}">${displayName}</button>`;
                }
                html += '</div></div>';
            }
            container.innerHTML = html;

            // 绑定点击事件
            container.querySelectorAll('.sb-piece-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const type = btn.dataset.type;
                    const col = btn.dataset.color;
                    handleSandboxPieceSelect(type, col);
                });
            });
        }

        function handleSandboxPieceSelect(type, color) {
            if (sandboxSelectedPiece && sandboxSelectedPiece.type === type && sandboxSelectedPiece.color === color) {
                // 再次点击取消选择
                sandboxSelectedPiece = null;
            } else {
                sandboxSelectedPiece = { type, color };
            }
            updateSandboxSelectionUI();
        }

        function updateSandboxSelectionUI() {
            // 清除所有选中状态
            document.querySelectorAll('.sb-piece-btn').forEach(b => b.classList.remove('selected'));
            // 高亮当前选中
            if (sandboxSelectedPiece) {
                document.querySelectorAll(`.sb-piece-btn[data-type="${sandboxSelectedPiece.type}"][data-color="${sandboxSelectedPiece.color}"]`).forEach(b => {
                    b.classList.add('selected');
                });
            }
            const sbStatus = document.getElementById('sbStatus');
            if (sandboxSelectedPiece) {
                const name = getPieceDisplayName(sandboxSelectedPiece.type, sandboxSelectedPiece.color);
                const colorName = sandboxSelectedPiece.color === 'red' ? '红方' : '黑方';
                sbStatus.textContent = `已选：${colorName}「${name}」· 点击棋盘空位放置（右键取消）`;
            } else {
                sbStatus.textContent = '点击左侧/右侧棋子选择，再点击棋盘放置';
            }
            // 清除棋盘选中高亮
            selectedPos = null;
            validMoves = [];
            drawBoard();
        }

        function handleSandboxBoardClick(row, col) {
            if (!sandboxMode || gameOver) return;
            // 未选中棋子时，点击已有棋子可删除

                    document.getElementById('sbStatus').textContent = '请先在侧边栏选择棋子';

                return;
            }
            // 检查是否已有棋子

                document.getElementById('sbStatus').textContent = '该位置已有棋子，无法重叠放置（未选棋子时点击可删除）';
                return;
            }
            // 放置棋子
            board[row][col] = {
                color: sandboxSelectedPiece.color,
                type: sandboxSelectedPiece.type,
                promoted: false
            };

            const name = getPieceDisplayName(sandboxSelectedPiece.type, sandboxSelectedPiece.color);
